[package]
name = "poolai"
version = "0.1.0"
edition = "2021"
authors = ["PoolAI Team"]
description = "AI Mining Pool Management System with Generative Model Integration"
license = "MIT"
repository = "https://github.com/poolai/poolai"
keywords = ["ai", "mining", "pool", "gpu", "blockchain", "distributed"]
categories = ["distributed-computing", "ai", "blockchain"]
default-run = "poolai"

[dependencies]
# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.9"

# Async runtime
tokio = { version = "1.49", features = ["full"] }

# Logging and tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Web framework
axum = { version = "0.8", features = ["ws"] }  # WebSocket support
tower = "0.5"
tower-http = { version = "0.5", features = ["cors", "trace"] }

# WebSocket support
futures-util = "0.3"

# JWT authentication (optional - enabled with feature "jwt")
# Use: cargo build --features jwt
# Note: Requires native toolchain (gcc/dlltool on Windows GNU)
# Without this feature, uses fallback base64 encoding (dev only, NOT SECURE)
jsonwebtoken = { version = "10.2", optional = true }

# HTTPS/TLS support (optional - enabled with feature "https")
# Use: cargo build --features https
# Note: Requires native toolchain (gcc/dlltool on Windows GNU)
axum-server = { version = "0.8", optional = true, features = ["tls-rustls"] }

# Using base64 for temporary token encoding (dev only or fallback)
base64 = { version = "0.22", features = ["alloc"] }
# URL encoding for OAuth2
urlencoding = "2.1"

# Error handling
thiserror = "2.0"

# Date and time
chrono = { version = "0.4", features = ["serde"] }

# UUID generation
uuid = { version = "1.19", features = ["v4", "serde"] }

# Async traits
async-trait = "0.1"

# Lazy static initialization
lazy_static = "1.4"

# Random number generation
rand = "0.9"

# Lock-free data structures
parking_lot = "0.12"

# HTTP client for library downloads
# Using default features without native-tls to avoid zstd-sys compilation issues
reqwest = { version = "0.11", features = ["stream", "json"], default-features = false }

# Archive extraction
flate2 = "1.0"
tar = "0.4"
# zip default features enable bzip2 + zstd, which require a C toolchain (gcc.exe) on windows-gnu.
# Keep it minimal/pure-Rust for now.
zip = { version = "7.0", default-features = false, features = ["deflate", "time"] }

# Checksum verification
sha2 = "0.10"
hex = "0.4"

# Raft consensus (optional - enabled with feature "raft")
# Use: cargo build --features raft
async-raft = { version = "0.6.1", optional = true }
anyhow = { version = "1.0", optional = true }

# VM Isolation - Linux system calls (optional - enabled with feature "vm-isolation-linux")
# Use: cargo build --features vm-isolation-linux
# Note: Requires root privileges or CAP_NET_ADMIN, CAP_SYS_ADMIN
nix = { version = "0.30", optional = true }

# Cloud SDK dependencies (optional - enabled with feature "cloud-sdk")
# Use: cargo build --features cloud,cloud-sdk
# Note: Some SDKs require Rust 1.88+ (AWS SDK), consider upgrading Rust version
# Kubernetes API client
# Note: k8s-openapi features should only be enabled in binary crates, not libraries
# Library crates should use k8s_if_* macros or build scripts for version-specific code
k8s-openapi = { version = "0.21", optional = true }
# Note: kube-rs requires Rust 1.88+ (home@0.5.12 dependency)
# Using reqwest + k8s-openapi directly instead for Rust 1.70+ compatibility
# kube = { version = "0.87", features = ["runtime", "client"], optional = true }
# AWS SDK (requires Rust 1.88+)
# Note: Commented out until Rust version is upgraded to 1.88+
# aws-config = { version = "1.1", optional = true }
# aws-sdk-ec2 = { version = "1.30", optional = true }
# aws-sdk-ecs = { version = "1.30", optional = true }
# aws-sdk-s3 = { version = "1.30", optional = true }
# Azure SDK (older versions compatible with Rust 1.70+)
azure_core = { version = "0.19", optional = true }
azure_identity = { version = "0.19", optional = true }
azure_mgmt_compute = { version = "0.21", optional = true }
# GCP SDK (using google-cloud-rust crates)
# Note: google-cloud-rust may not exist, using placeholder for now
# google-cloud-rust = { version = "0.1", optional = true }

# VM Isolation - Windows API (optional - enabled with feature "vm-isolation-windows")
# Use: cargo build --features vm-isolation-windows
# Note: Requires administrator privileges
# Note: Windows isolation implementation is planned but not yet implemented
# windows-sys = { version = "0.52", optional = true, features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_System_Threading"] }

# Windows API (only on Windows) - commented out for now
# Full Windows Job Objects implementation requires proper Windows API integration
# [target.'cfg(windows)'.dependencies]
# windows = { version = "0.58", features = [
#     "Win32_Foundation",
#     "Win32_System_JobObjects",
#     "Win32_System_Threading",
#     "Win32_System_ProcessStatus",
# ] }

# Build script dependencies
[build-dependencies]

# Dev dependencies for testing
[dev-dependencies]
tempfile = "3.24"
# k8s-openapi dev-dependency for library crate (required for tests/examples)
# Note: Library crates must not enable features in direct dependency, only in dev-dependency
# Using v1_28 as it's available in k8s-openapi 0.21
k8s-openapi = { version = "0.21", features = ["v1_28"] }

[features]
default = []
# JWT authentication (optional - requires native toolchain: gcc/dlltool on Windows GNU)
# Use: cargo build --features jwt
# Note: Without this feature, uses fallback base64 encoding (dev only, NOT SECURE)
jwt = ["jsonwebtoken"]
# HTTPS/TLS support (optional - requires native toolchain: gcc/dlltool on Windows GNU)
# Use: cargo build --features https
# Note: Without this feature, server runs in HTTP mode
https = ["axum-server"]
# Raft consensus for distributed RAID (optional)
# Use: cargo build --features raft
raft = ["async-raft", "anyhow"]
# Enterprise features (optional)
# Use: cargo build --features enterprise
enterprise = []
# Cloud integration features (optional)
# Use: cargo build --features cloud
# Note: SDK dependencies are optional and can be added when needed
cloud = []
# Cloud SDK integration (optional - requires cloud feature)
# Use: cargo build --features cloud,cloud-sdk
# Note: Adds heavy SDK dependencies (k8s-openapi, azure SDK, etc.)
# Note: AWS SDK requires Rust 1.88+ and is commented out until Rust version is upgraded
cloud-sdk = [
    "k8s-openapi",
    # "kube", # Requires Rust 1.88+, using reqwest + k8s-openapi directly instead
    "azure_core",
    "azure_identity",
    "azure_mgmt_compute"
]
# VM Isolation - Linux (requires root or CAP_NET_ADMIN, CAP_SYS_ADMIN)
# Use: cargo build --features vm-isolation-linux
vm-isolation-linux = ["nix"]
# VM Isolation - Windows (requires administrator privileges)
# Use: cargo build --features vm-isolation-windows
# Note: Windows isolation implementation is planned but not yet implemented
# vm-isolation-windows = ["windows-sys"]
# Full VM isolation (platform-specific)
# Note: Windows isolation is planned but not yet implemented
vm-isolation = ["vm-isolation-linux"]
# Full security features (when both jwt and https are available)
# security = ["jwt", "https"]

