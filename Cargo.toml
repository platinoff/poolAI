[package]
name = "poolai"
version = "0.1.0"
edition = "2021"
authors = ["PoolAI Team"]
description = "AI Mining Pool Management System with Generative Model Integration"
license = "MIT"
repository = "https://github.com/poolai/poolai"
keywords = ["ai", "mining", "pool", "gpu", "blockchain", "distributed"]
categories = ["distributed-computing", "ai", "blockchain"]

[dependencies]
# Async runtime
tokio = { version = "1.0", features = ["full"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Logging
log = "0.4"
env_logger = "0.10"

# HTTP client/server
reqwest = { version = "0.11", features = ["json"] }
warp = "0.3"
tower = "0.4"

# Configuration
config = "0.13"
toml = "0.8"

# Time handling
chrono = { version = "0.4", features = ["serde"] }

# Random number generation
rand = "0.8"

# System information
sysinfo = "0.29"

# Cryptography
sha2 = "0.10"
hmac = "0.12"

# Compression
flate2 = "1.0"

# UUID generation
uuid = { version = "1.0", features = ["v4"] }

# Command line arguments
clap = { version = "4.0", features = ["derive"] }

# Progress bars
indicatif = "0.17"

# Color output
colored = "2.0"

# File watching
notify = "6.0"

[features]
default = ["basic"]
basic = []
full = ["database", "telegram", "websocket", "metrics"]
database = []
telegram = []
websocket = []
metrics = []

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.dev]
opt-level = 0
debug = true

[[bin]]
name = "poolai"
path = "src/main.rs"

[lib]
name = "poolai"
path = "src/lib.rs"

[workspace]
members = ["."]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"] 