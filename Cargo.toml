[package]
name = "poolai"
version = "0.1.0"
edition = "2021"
authors = ["PoolAI Team"]
description = "AI Mining Pool Management System with Generative Model Integration"
license = "MIT"
repository = "https://github.com/poolai/poolai"
keywords = ["ai", "mining", "pool", "gpu", "blockchain", "distributed"]
categories = ["distributed-computing", "ai", "blockchain"]

[dependencies]
# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"

# Async runtime
tokio = { version = "1.35", features = ["full"] }

# Logging and tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Web framework
axum = { version = "0.7", features = ["ws"] }  # WebSocket support
# axum-server = "0.6"  # Temporarily disabled - requires ring/gcc
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "trace"] }

# WebSocket support
futures-util = "0.3"

# JWT authentication (temporarily disabled - requires ring/gcc)
# jsonwebtoken = "9.3"  # Uncomment after installing gcc
# Using base64 for temporary token encoding (dev only)
base64 = { version = "0.22", features = ["alloc"] }

# Error handling
thiserror = "1.0"

# Date and time
chrono = { version = "0.4", features = ["serde"] }

# UUID generation
uuid = { version = "1.6", features = ["v4", "serde"] }

# Async traits
async-trait = "0.1"

# Lazy static initialization
lazy_static = "1.4"

# Random number generation
rand = "0.8"

# Lock-free data structures
parking_lot = "0.12"

# Build script dependencies
[build-dependencies]

[features]
default = []
# https = ["axum-server/rustls"]  # Temporarily disabled - requires ring/gcc
