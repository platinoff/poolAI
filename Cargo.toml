[package]
name = "poolai"
version = "0.1.0"
edition = "2021"
authors = ["PoolAI Team"]
description = "AI Mining Pool Management System with Generative Model Integration"
license = "MIT"
repository = "https://github.com/poolai/poolai"
keywords = ["ai", "mining", "pool", "gpu", "blockchain", "distributed"]
categories = ["distributed-computing", "ai", "blockchain"]

[dependencies]
# Async runtime - MVP КРИТИЧНО
tokio = { version = "1.36", features = ["full"] }

# Serialization - MVP КРИТИЧНО
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error handling - MVP КРИТИЧНО
thiserror = "1.0"
async-trait = "0.1"
anyhow = "1.0"

# Logging - MVP КРИТИЧНО
tracing = "0.1"
tracing-subscriber = "0.3"

# Configuration - MVP КРИТИЧНО
config = "0.13"
toml = "0.8"

# Time handling
chrono = { version = "0.4", features = ["serde"] }

# Random number generation
rand = "0.8"

# System information
sysinfo = "0.29"

# UUID generation
uuid = { version = "1.7", features = ["v4"] }

# Synchronization primitives
parking_lot = "0.12"

# Command line arguments
clap = { version = "4.0", features = ["derive"] }

# Network dependencies - Stage 2
axum = { version = "0.7", features = ["ws", "macros"] }
tower = "0.4"
tokio-tungstenite = "0.20"
futures = "0.3"

# HTTPS/TLS dependencies - Stage 2
axum-server = "0.6"
rustls = "0.21"
rustls-pemfile = "1.0"
tokio-rustls = "0.24"
jsonwebtoken = "9.0"
tower-http = { version = "0.5", features = ["cors", "trace"] }

[features]
default = []
stage2 = []
stage3 = ["network", "platform", "tgbot"]

# Stage 2 features (future)
network = []
platform = []
tgbot = []

# Stage 3 features (future)
runtime = []
libs = []
vm = []
raid = []
ui = []

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.dev]
opt-level = 0
debug = true

[[bin]]
name = "poolai"
path = "src/main.rs"

[lib]
name = "poolai"
path = "src/lib.rs"

[workspace]
members = ["."]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
