[workspace]
resolver = "2"
members = [
    ".",
    "crates/poolai-solana-adapter",
    "crates/poolai-solana-adapter/program/poolai-events",
]

[package]
name = "poolai"
version = "0.2.2"
edition = "2021"
authors = ["PoolAI Team"]
description = "AI Mining Pool Management System with Generative Model Integration"
license = "MIT"
repository = "https://github.com/poolai/poolai"
keywords = ["ai", "mining", "pool", "gpu", "blockchain", "distributed"]
categories = ["distributed-computing", "ai", "blockchain"]
default-run = "poolai"

[dependencies]
# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.9"

# Async runtime
tokio = { version = "1.49", features = ["full"] }

# Logging and tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Web framework
axum = { version = "0.8", features = ["ws"] }  # WebSocket support
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace"] }

# WebSocket and streaming support
futures-util = "0.3"
tokio-stream = "0.1"

# JWT authentication (optional - enabled with feature "jwt")
# Use: cargo build --features jwt
# Note: Requires native toolchain (gcc/dlltool on Windows GNU)
# Without this feature, uses fallback base64 encoding (dev only, NOT SECURE)
jsonwebtoken = { version = "10.2", optional = true, features = ["rust_crypto"] }

# HTTPS/TLS support (optional - enabled with feature "https")
# Use: cargo build --features https
# Note: Requires native toolchain (gcc/dlltool on Windows GNU)
axum-server = { version = "0.8", optional = true, features = ["tls-rustls"] }
rustls = { version = "0.23", optional = true, default-features = false, features = ["ring", "std", "tls12"] }

# Using base64 for temporary token encoding (dev only or fallback)
base64 = { version = "0.22", features = ["alloc"] }
# URL encoding for OAuth2
urlencoding = "2.1"

# Error handling
thiserror = "2.0"

# Date and time
chrono = { version = "0.4", features = ["serde"] }
# Note: chrono is also used by aws-sign-v4 for timestamps

# UUID generation
uuid = { version = "1.19", features = ["v4", "serde"] }

# CPU detection
num_cpus = "1.17"

# Async traits
async-trait = "0.1"

# Random number generation
rand = "0.9"

# Lock-free data structures
parking_lot = "0.12"

# LRU cache
lru = "0.16"

# Portable f32 SIMD for TurboQuant fast-path (`feature = "turboquant-simd"`)
wide = { version = "0.7", optional = true }

# HTTP client for library downloads
# Using default features without native-tls to avoid zstd-sys compilation issues
reqwest = { version = "0.13", features = ["stream", "json"], default-features = false }

# Telegram bot (FM-016++, optional)
teloxide = { version = "0.13", optional = true, default-features = false, features = ["macros", "ctrlc_handler", "rustls"] }

# Archive extraction
flate2 = "1.0"
tar = "0.4"
# zip default features enable bzip2 + zstd, which require a C toolchain (gcc.exe) on windows-gnu.
# Keep it minimal/pure-Rust for now.
zip = { version = "7.0", default-features = false, features = ["deflate", "time"] }

# Checksum verification
sha2 = "0.10"
hmac = "0.12"
hex = "0.4"
ed25519-dalek = { version = "2.1", default-features = false, features = ["std"] }

# SQLite database for enterprise monitoring persistence
rusqlite = { version = "0.32", features = ["bundled"] }

# Raft consensus (optional - enabled with feature "raft")
# Use: cargo build --features raft
async-raft = { version = "0.6.1", optional = true }
anyhow = { version = "1.0", optional = true }

# VM Isolation - Linux system calls (optional - enabled with feature "vm-isolation-linux")
# Use: cargo build --features vm-isolation-linux
# Note: Requires root privileges or CAP_NET_ADMIN, CAP_SYS_ADMIN
nix = { version = "0.30", optional = true }

# Cloud SDK dependencies (optional - enabled with feature "cloud-sdk")
# Use: cargo build --features cloud,cloud-sdk
# Note: Some SDKs require Rust 1.88+ (AWS SDK), consider upgrading Rust version
# Kubernetes API client
# Note: k8s-openapi features should only be enabled in binary crates, not libraries
# Library crates should use k8s_if_* macros or build scripts for version-specific code
# k8s-openapi requires a version feature flag (v1_28 used for compatibility)
# Note: Version feature is added in cloud-sdk feature below
k8s-openapi = { version = "0.24", optional = true }
# Note: kube-rs requires Rust 1.88+ (home@0.5.12 dependency)
# Using reqwest + k8s-openapi directly instead for Rust 1.70+ compatibility
# kube = { version = "0.87", features = ["runtime", "client"], optional = true }
# AWS Signature Version 4 signing (for REST API calls without full SDK)
# Note: Using aws-sign-v4 as it supports Rust 1.70+ (alternative to aws-sigv4 which requires 1.88+)
# Note: aws-sign-v4 uses chrono internally, but we already have chrono in dependencies
aws-sign-v4 = { version = "0.3", optional = true }
http = { version = "1", optional = true }
# AWS SDK (requires Rust 1.88+, now available with Rust 1.92.0)
aws-config = { version = "1.1", optional = true }
aws-sdk-ec2 = { version = "1.30", optional = true }
aws-sdk-ecs = { version = "1.30", optional = true }
aws-sdk-s3 = { version = "1.30", optional = true }
# Azure SDK (older versions compatible with Rust 1.70+)
azure_core = { version = "0.30", optional = true }
azure_identity = { version = "0.30", optional = true }
# GCP SDK (using google-cloud-rust crates)
# Note: google-cloud-rust may not exist, using placeholder for now
# google-cloud-rust = { version = "0.1", optional = true }

# VM Isolation - Windows API (optional - enabled with feature "vm-isolation-windows")
# Use: cargo build --features vm-isolation-windows
# Note: Requires administrator privileges for some features
windows-sys = { version = "0.61.2", optional = true, features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_ProcessStatus"] }
opentelemetry = { version = "0.28", optional = true }
opentelemetry_sdk = { version = "0.28", features = ["rt-tokio"], optional = true }
opentelemetry-otlp = { version = "0.28", features = ["http-proto", "reqwest-blocking-client"], optional = true }
tracing-opentelemetry = { version = "0.29", optional = true }
# PH-S07 / FM-043: Prometheus text exposition at GET /metrics
prometheus = { version = "0.14", optional = true, features = ["process"] }

# Windows API (only on Windows) - commented out for now
# Full Windows Job Objects implementation requires proper Windows API integration
# [target.'cfg(windows)'.dependencies]
# windows = { version = "0.58", features = [
#     "Win32_Foundation",
#     "Win32_System_JobObjects",
#     "Win32_System_Threading",
#     "Win32_System_ProcessStatus",
# ] }

# Build script dependencies
[build-dependencies]

# Dev dependencies for testing
[dev-dependencies]
tempfile = "3.24"
# Benchmark framework
# Note: criterion 0.8+ requires Rust 1.86+ (MSRV), stable 1.91.1+
# Breaking: async-std support dropped (we use tokio, so this is fine)
criterion = { version = "0.8", features = ["async_tokio"] }
# k8s-openapi dev-dependency for library crate (required for tests/examples)
# Note: Library crates must not enable features in direct dependency, only in dev-dependency
# Using v1_28 as it's available in k8s-openapi 0.21
k8s-openapi = { version = "0.24", features = ["v1_28"] }
# Mock HTTP server for integration tests
mockito = "1.4"

[[bin]]
