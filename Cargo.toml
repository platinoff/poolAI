[features]
default = []
# JWT authentication (optional - requires native toolchain: gcc/dlltool on Windows GNU)
# Use: cargo build --features jwt
# Note: Without this feature, uses fallback base64 encoding (dev only, NOT SECURE)
jwt = ["jsonwebtoken"]
# HTTPS/TLS support (optional - requires native toolchain: gcc/dlltool on Windows GNU)
# Use: cargo build --features https
# Note: Without this feature, server runs in HTTP mode
https = ["axum-server", "dep:rustls"]
# Raft consensus for distributed RAID (optional)
# Use: cargo build --features raft
raft = ["async-raft", "anyhow"]
# Enterprise features (optional)
# Use: cargo build --features enterprise
enterprise = []
# Stage 4.4 AI/ML (v0.3.0+) — Model Optimization, AutoML, Federated Learning
# Use: cargo build --features ml (also enable enterprise for /api/enterprise/ai-ml)
ml = []
# FM-004 / Horizon S35: SIMD pack/unpack/dot via `wide` (requires `ml` for turboquant module)
turboquant-simd = ["dep:wide"]
# Cloud integration features (optional)
# Use: cargo build --features cloud
# Note: SDK dependencies are optional and can be added when needed
cloud = []
# Cloud SDK integration (optional - requires cloud feature)
# Use: cargo build --features cloud,cloud-sdk
# Note: Adds heavy SDK dependencies (k8s-openapi, azure SDK, etc.)
# Note: AWS SDK requires Rust 1.88+ and is commented out until Rust version is upgraded
cloud-sdk = [
    "k8s-openapi/v1_28",  # Enable Kubernetes API v1.28 support
    # "kube", # Requires Rust 1.88+, using reqwest + k8s-openapi directly instead
    "aws-sign-v4",  # AWS Signature Version 4 signing for REST API (Rust 1.70+ compatible, fallback)
    # Note: chrono is already in dependencies (line 55), no need to add here
    "http",  # HTTP types for request building
    "aws-config",  # AWS SDK config (Rust 1.88+ compatible, now available with 1.92.0)
    "aws-sdk-ec2",  # AWS SDK for EC2
    "aws-sdk-ecs",  # AWS SDK for ECS
    "aws-sdk-s3",  # AWS SDK for S3
    "azure_core",
    "azure_identity",
    "jsonwebtoken"  # JWT signing for GCP service account authentication
]
# VM Isolation - Linux (requires root or CAP_NET_ADMIN, CAP_SYS_ADMIN)
# Use: cargo build --features vm-isolation-linux
vm-isolation-linux = ["nix"]
# VM Isolation - Windows (requires administrator privileges)
# Use: cargo build --features vm-isolation-windows
vm-isolation-windows = ["windows-sys"]
# Full VM isolation (platform-specific)
# Note: Windows isolation is planned but not yet implemented
vm-isolation = ["vm-isolation-linux"]
# Full security features (when both jwt and https are available)
# security = ["jwt", "https"]
# Attach core managers / rewards engine to AppState in integration tests without full app init (see AppState::attach_*_for_test)
test-utils = []
# Telegram bot runtime (teloxide) — `poolai-telegram-bot` binary
tgbot = ["teloxide"]
# FM-029: SQLite job store (`POOLAI_JOB_STORE=sqlite` + `POOLAI_JOB_DATA_DIR`)
job-store-sqlite = []
# FM-038: OpenTelemetry distributed tracing (OTLP export + W3C trace context)
# Use: cargo build --features otel
# Env: OTEL_EXPORTER_OTLP_ENDPOINT (required to export), OTEL_SERVICE_NAME (default poolai)
otel = [
    "dep:opentelemetry",
    "dep:opentelemetry_sdk",
    "dep:opentelemetry-otlp",
    "dep:tracing-opentelemetry",
]
# PH-S07 / FM-043: Prometheus pull metrics at GET /metrics (OTLP tracing stays on `otel`)
# Use: cargo build --features prometheus,enterprise
prometheus = ["dep:prometheus"]

# Some Windows MSVC hosts hit `rustc` STATUS_ACCESS_VIOLATION when compiling the full `poolai` lib at
# `release` opt-level 3 (e.g. `cargo bench` / `cargo build --release`). The `bench` profile keeps
# release settings but lowers codegen for benchmark binaries so local Criterion runs can finish.
[profile.bench]
inherits = "release"
# MSVC hosts: `rustc` may AV even at opt-level 2 on the full crate; 0 keeps Criterion runnable locally.
opt-level = 0

# Windows MSVC: `cargo test --all-features` links many large test binaries; full debuginfo (default) can
# trigger LINK LNK1318 (Unexpected PDB error; LIMIT). Line tables only keeps PDBs small enough (FM-011).
[profile.test]
debug = 1

