[build]
target-dir = "target"
rustflags = ["-C", "link-arg=-Wl,-rpath,/home/rust/libtorch/lib"]

[target.x86_64-unknown-linux-gnu]
rustflags = ["-C", "link-arg=-Wl,-rpath,/home/rust/libtorch/lib"]

[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]

[target.x86_64-pc-windows-gnu]
linker = "x86_64-w64-mingw32-gcc"

[env]
# MSYS2 path for dlltool.exe and other MinGW tools (Windows)
# Set this if dlltool.exe is not in PATH
# Note: On Windows, you may need to add C:\msys64\usr\bin to PATH
# or run scripts/setup_msys2_path.ps1 before building
CXXFLAGS = "-std=c++17"
LIBTORCH = "/home/rust/libtorch"
LD_LIBRARY_PATH = "/home/rust/libtorch/lib"

# FM-011: same shape as CI "Run tests (default)" — `lib` + `tests/` only (skips doctests; avoids Windows
# paging-file failures on full `cargo test`). Set K8S_OPENAPI_ENABLED_VERSION=1.28 when cloud code paths compile.
[alias]
test-ci = "test -j 1 --lib --tests --features ml,enterprise,cloud,test-utils,job-store-sqlite,prometheus -- --test-threads=1"
# PH-S04: Raft HTTP wire (`GET /api/v1/raid/status`); run after `test-ci`.
test-raft-ci = "test -j 1 --test raft_wire_integration --test raft_multi_node_harness --features raft,test-utils -- --test-threads=1"