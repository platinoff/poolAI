[package]
name = "poolai-solana-adapter"
version = "0.1.0"
edition = "2021"
authors = ["PoolAI Team"]
description = "PoolAI Solana sidecar — domain event schema v1 (no solana-sdk in poolai main)"
license = "MIT"
repository = "https://github.com/poolai/poolai"
publish = false

[dependencies]
base64 = "0.22"
bincode = "1.3"
borsh = "1.5"
chrono = { version = "0.4", features = ["serde"] }
reqwest = { version = "0.13", features = ["json", "blocking", "rustls"], default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
solana-hash = "2.3"
solana-instruction = "2.3"
solana-keypair = "3.1"
solana-pubkey = "2.4"
solana-signer = "2.2"
solana-transaction = { version = "2.2", default-features = false, features = ["bincode"] }
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[[bin]]
name = "poolai-solana-adapter"
path = "src/bin/poolai-solana-adapter.rs"
