<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PoolAI Galaxy Starwalker Vision</title>
  <link rel="stylesheet" href="vision.css?v=83" />
</head>
<body>
  <div id="galaxy-backdrop" class="galaxy-backdrop" aria-hidden="true">
    <img class="galaxy-backdrop-img" src="" alt="" />
  </div>
  <canvas id="starfield" aria-hidden="true"></canvas>
  <header>
    <div id="rss-ticker" class="rss-ticker" aria-label="Sprint feed ticker" hidden>
      <span class="rss-ticker-label" title="FM §5.12 feed from feed.json">Feed</span>
      <div class="rss-ticker-viewport" aria-live="polite">
        <ul class="rss-ticker-track" id="rss-ticker-track"></ul>
      </div>
    </div>
    <div class="header-main">
      <button type="button" id="btn-sidebar" title="Toggle Explorer (overlay in fullscreen)">☰</button>
      <h1>PoolAI Galaxy Starwalker Vision</h1>
      <span class="meta" id="meta-rev">…</span>
      <span class="meta-trail" id="meta-trail" aria-label="Git HEAD and next sprint"></span>
      <div class="header-actions" aria-label="Vision controls">
        <button type="button" id="btn-eco" class="btn-eco on" title="Eco — low GPU. Click → FX → Ms">Eco</button>
        <button type="button" id="btn-auto" class="btn-auto on" title="Auto-reload when vision files change">Auto</button>
        <button type="button" id="btn-reload" title="Reload manifest.json">↻ Reload</button>
        <button type="button" id="btn-power" title="Vision power menu">⏻ Power</button>
      </div>
    </div>
  </header>
  <div class="workspace">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-head">
        <button type="button" id="btn-sidebar2" title="Collapse">◀</button>
        <span class="sidebar-title"><span>Explorer</span> <span class="sprint-pill" id="sidebar-sprint" hidden></span></span>
      </div>
      <div class="sidebar-body" id="file-tree"></div>
    </aside>
    <div class="main-col">
      <div class="panel-dock" id="panel-dock" hidden aria-label="Collapsed panels — click to restore"></div>
      <div class="diagram-row">
        <section class="panel" data-panel="layers" aria-label="Layer stack">
          <h2><span data-short="Ly">Layers</span><span class="panel-head-actions"><button type="button" class="btn-panel-collapse" title="Collapse to title bar">−</button><button type="button" class="btn-panel-fs" title="Fullscreen (Esc)">⛶</button></span></h2>
          <div class="panel-body" id="graph-3d">
            <div class="layer-stack" id="layer-stack"></div>
          </div>
          <div class="legend-bar" id="layer-legend" aria-label="Layer legend"></div>
        </section>
        <section class="panel" data-panel="queue" aria-label="Sprint queue FM §5.12">
          <h2><span data-short="Queue">Sprint queue</span><span class="panel-head-actions"><button type="button" class="btn-panel-collapse" title="Collapse to title bar">−</button><button type="button" class="btn-panel-fs" title="Fullscreen (Esc)">⛶</button></span></h2>
          <div class="panel-body sprint-queue-body" id="sprint-queue" aria-live="polite"></div>
        </section>
        <section class="panel" data-panel="map" aria-label="Interactive map">
          <h2><span data-short="Map">Galaxy map</span><span class="panel-head-actions"><button type="button" class="btn-panel-collapse" title="Collapse to title bar">−</button><button type="button" class="btn-panel-fs" title="Fullscreen (Esc)">⛶</button></span></h2>
          <div class="panel-body map-wrap">
            <div class="map-scene-3d" id="map-scene-3d">
            <img class="galaxy-bg" src="" alt="" />
            <svg id="map-svg" viewBox="0 0 900 520" role="group" aria-label="Documentation graph — Tab to nodes and controls, arrow keys for linked neighbors, WASD to orbit"></svg>
            </div>
            <div
              class="map-orbit-pad"
              id="map-orbit-pad"
              role="application"
              aria-label="3D orbit control — drag or use W A S D keys"
              title="Drag to orbit · W A S D keys"
            >
              <div class="map-orbit-pad-ring" aria-hidden="true"></div>
              <div class="map-orbit-pad-stick" id="map-orbit-stick" aria-hidden="true"></div>
              <span class="map-orbit-pad-label" aria-hidden="true">WASD</span>
            </div>
            <div class="map-toolbar" aria-label="Map filters">
              <button type="button" id="btn-map-sprint" class="btn-map-toggle" title="Dim nodes outside active sprint (PH-S*)">◎ Sprint</button>
              <button type="button" id="btn-map-clusters" class="btn-map-toggle on" title="Collapse dense folders">⊟ Folders</button>
            </div>
            <div class="map-filter-bar" id="map-filter-bar" aria-label="Layer and file-type filters">
              <div class="map-filter-drop">
                <button type="button" class="map-filter-drop-btn" id="map-filter-layers-btn" data-drop="layers" aria-expanded="false" aria-controls="map-filter-layers-menu">Layers ▾</button>
                <div class="map-filter-drop-menu" id="map-filter-layers-menu" hidden>
                  <div class="map-filter-group" data-group="layers">
                    <div class="map-filter-head">
                      <span class="map-filter-label">Layers</span>
                      <span class="map-filter-bulk">
                        <button type="button" class="map-filter-bulk-btn" id="map-layers-all" title="Show all layers on map">All</button>
                        <button type="button" class="map-filter-bulk-btn" id="map-layers-none" title="Hide all layers on map">None</button>
                      </span>
                    </div>
                    <div class="map-filter-chips" id="map-layer-chips"></div>
                  </div>
                </div>
              </div>
              <div class="map-filter-drop">
                <button type="button" class="map-filter-drop-btn" id="map-filter-exts-btn" data-drop="exts" aria-expanded="false" aria-controls="map-filter-exts-menu">Types ▾</button>
                <div class="map-filter-drop-menu" id="map-filter-exts-menu" hidden>
                  <div class="map-filter-group" data-group="ext">
                    <div class="map-filter-head">
                      <span class="map-filter-label">Types</span>
                      <span class="map-filter-bulk">
                        <button type="button" class="map-filter-bulk-btn" id="map-exts-all" title="Show all file types on map">All</button>
                        <button type="button" class="map-filter-bulk-btn" id="map-exts-none" title="Hide all file types on map">None</button>
                      </span>
                    </div>
                    <div class="map-filter-chips" id="map-ext-chips"></div>
                  </div>
                </div>
              </div>
            </div>
            <div class="map-bottom-bar" aria-label="Map navigation">
              <div class="map-controls" aria-label="Map zoom">
                <button type="button" id="map-zoom-in" title="Zoom in">+</button>
                <button type="button" id="map-zoom-out" title="Zoom out">−</button>
                <button type="button" id="map-orbit-auto" class="on" title="Pause auto-orbit (~30% WASD speed)" aria-pressed="true" aria-label="Pause auto-orbit">⏸</button>
                <button type="button" id="map-zoom-reset" title="Reset view — fit all nodes, resume auto-orbit">⌂</button>
                <button type="button" id="map-zoom-back" title="Back to previous view" disabled aria-label="Back to previous view">←</button>
              </div>
              <span class="map-hint">▶/⏸ orbit · W↑ S↓ A← D→ · drag pad · Tab · Eco→FX→Ms · ⌂ fit all</span>
            </div>
            <p id="map-selection-live" class="map-selection-live" aria-live="polite" aria-atomic="true"></p>
            <aside class="map-minimap" id="map-minimap" aria-label="Map minimap — viewport inset and selection ring; click to pan">
              <svg id="map-minimap-svg" viewBox="0 0 900 580" role="img" aria-hidden="true"></svg>
            </aside>
          </div>
        </section>
        <section class="panel" data-panel="links" aria-label="Links">
          <h2><span data-short="Links">Links</span><span class="panel-head-actions"><button type="button" class="btn-panel-collapse" title="Collapse to title bar">−</button><button type="button" class="btn-panel-fs" title="Fullscreen (Esc)">⛶</button></span></h2>
          <div class="panel-body">
            <svg id="link-graph" aria-label="Neighbour graph"></svg>
            <ul class="links-list" id="links-list"></ul>
            <div class="sprint-chips" id="sprint-chips"></div>
          </div>
        </section>
      </div>
      <section class="panel preview-panel" data-panel="preview" aria-label="Document preview">
        <h2><span data-short="Preview">Preview</span><span class="panel-head-actions"><button type="button" class="btn-panel-collapse" title="Collapse to title bar">−</button><button type="button" class="btn-panel-fs" title="Fullscreen (Esc)">⛶</button></span></h2>
        <div class="panel-body">
          <p id="doc-hint">Select a file in the sidebar or on the map.</p>
          <pre id="doc-preview"></pre>
        </div>
      </section>
    </div>
  </div>
  <script src="vision.js?v=83"></script>
</body>
</html>
