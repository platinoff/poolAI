<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PoolAI docs vision</title>
  <style>
    :root {
      --bg: #0f1419;
      --panel: #1a2332;
      --border: #2d3a4d;
      --text: #e8eaed;
      --muted: #9aa0a6;
      --accent: #8ab4f8;
      --L0: #2d4a6f;
      --L1: #3d5a40;
      --L2: #5a4a2d;
      --L3: #5a2d4a;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    header {
      flex: 0 0 auto;
      padding: 8px 12px;
      border-bottom: 1px solid var(--border);
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
    }
    header h1 { margin: 0; font-size: 1rem; font-weight: 600; }
    header .meta { color: var(--muted); font-size: 0.75rem; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    button, select {
      background: var(--panel);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 4px 10px;
      cursor: pointer;
      font-size: 0.8rem;
    }
    button:hover { border-color: var(--accent); }
    main {
      flex: 1;
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      grid-template-rows: minmax(140px, 28vh) minmax(0, 1fr) minmax(120px, 22vh);
      grid-template-areas:
        "map map"
        "graph scope"
        "doc doc";
      gap: 6px;
      padding: 6px;
      min-height: 0;
    }
    @media (max-width: 768px) {
      main {
        grid-template-columns: 1fr;
        grid-template-areas: "map" "graph" "scope" "doc";
        grid-template-rows: auto;
        overflow: auto;
      }
      body { overflow: auto; height: auto; min-height: 100vh; }
    }
    .panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 6px;
      display: flex;
      flex-direction: column;
      min-height: 0;
      overflow: hidden;
    }
    .panel h2 {
      margin: 0;
      padding: 6px 10px;
      font-size: 0.78rem;
      font-weight: 600;
      border-bottom: 1px solid var(--border);
      background: rgba(0,0,0,0.25);
      flex-shrink: 0;
    }
    .panel-body {
      flex: 1;
      overflow: auto;
      padding: 6px;
      min-height: 0;
    }
    .panel-map { grid-area: map; }
    .panel-graph { grid-area: graph; }
    .panel-scope { grid-area: scope; }
    .panel-doc { grid-area: doc; }
    .panel-map .panel-body {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 4px;
    }
    .panel-map img, .panel-map object {
      max-width: 100%;
      max-height: 100%;
      width: auto;
      height: auto;
      object-fit: contain;
    }
    .graph-layout {
      display: grid;
      grid-template-columns: minmax(100px, 38%) minmax(0, 1fr);
      gap: 8px;
      height: 100%;
      min-height: 0;
    }
    #graph-3d {
      perspective: 700px;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 0;
    }
    .layer-stack {
      transform-style: preserve-3d;
      transform: rotateX(48deg) rotateZ(-24deg) scale(0.85);
      width: 200px;
      height: 120px;
      position: relative;
      flex-shrink: 0;
    }
    .layer-plane {
      position: absolute;
      left: 0;
      right: 0;
      height: 36px;
      border-radius: 4px;
      border: 1px solid rgba(255,255,255,0.2);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.65rem;
      cursor: pointer;
    }
    .layer-plane[data-layer="L0"] { background: var(--L0); bottom: 90px; }
    .layer-plane[data-layer="L1"] { background: var(--L1); bottom: 60px; }
    .layer-plane[data-layer="L2"] { background: var(--L2); bottom: 30px; }
    .layer-plane[data-layer="L3"] { background: var(--L3); bottom: 0; }
    .node-list {
      list-style: none;
      padding: 0;
      margin: 0;
      font-size: 0.72rem;
      line-height: 1.35;
    }
    .node-list li {
      padding: 4px 6px;
      margin-bottom: 3px;
      border-radius: 3px;
      border-left: 2px solid var(--accent);
      background: rgba(0,0,0,0.2);
      word-break: break-word;
    }
    .node-list a { color: var(--accent); text-decoration: none; }
    .node-list a:hover { text-decoration: underline; }
    .node-list .layer-tag {
      font-size: 0.65rem;
      color: var(--muted);
      margin-right: 4px;
    }
    .node-list .sprints {
      display: block;
      color: var(--muted);
      font-size: 0.65rem;
      margin-top: 2px;
    }
    details.scope-item {
      margin-bottom: 6px;
      border: 1px solid var(--border);
      border-radius: 4px;
      background: rgba(0,0,0,0.2);
      font-size: 0.72rem;
    }
    details.scope-item summary {
      padding: 6px 8px;
      cursor: pointer;
      color: var(--accent);
      font-weight: 600;
    }
    details.scope-item .scope-body {
      padding: 0 8px 8px;
      color: var(--muted);
      word-break: break-all;
    }
    details.scope-item .scope-body div { margin-top: 4px; }
    #doc-preview {
      margin: 0;
      font-family: ui-monospace, "Cascadia Mono", Consolas, monospace;
      font-size: 0.7rem;
      line-height: 1.4;
      white-space: pre-wrap;
      word-break: break-word;
      color: #c9d1d9;
      max-height: 100%;
      overflow: auto;
    }
    #doc-hint {
      margin: 0 0 6px;
      font-size: 0.72rem;
      color: var(--muted);
      word-break: break-all;
    }
    .error { color: #f28b82; font-size: 0.8rem; }
  </style>
</head>
<body>
  <header>
    <h1>PoolAI docs vision</h1>
    <span class="meta" id="meta-rev">loading</span>
    <button type="button" id="btn-reload">Reload</button>
    <select id="doc-select" aria-label="Open document">
      <option value="">doc</option>
    </select>
  </header>
  <main>
    <section class="panel panel-map" aria-label="Map">
      <h2>Map (vision.svg)</h2>
      <div class="panel-body">
        <img id="svg-img" src="vision.svg" alt="PoolAI documentation layers" />
      </div>
    </section>
    <section class="panel panel-graph" aria-label="Graph">
      <h2>Layers + nodes</h2>
      <div class="panel-body graph-layout">
        <div id="graph-3d">
          <div class="layer-stack" id="layer-stack"></div>
        </div>
        <ul class="node-list" id="node-list"></ul>
      </div>
    </section>
    <section class="panel panel-scope" aria-label="Scope">
      <h2>Sprint scope</h2>
      <div class="panel-body" id="scope-panel"></div>
    </section>
    <section class="panel panel-doc" aria-label="Preview">
      <h2>Doc preview</h2>
      <div class="panel-body">
        <p id="doc-hint">Click a node to preview markdown (first 80 lines).</p>
        <pre id="doc-preview"></pre>
      </div>
    </section>
  </main>
  <script>
    const VISION_BASE = "/docs/vision/";

    function repoUrl(relPath) {
      return "/" + relPath.replace(/^\//, "");
    }

    async function loadJson(name) {
      const url = VISION_BASE + name + "?t=" + Date.now();
      const r = await fetch(url);
      if (!r.ok) throw new Error(name + " HTTP " + r.status);
      return r.json();
    }

    function renderManifest(m) {
      document.getElementById("meta-rev").textContent =
        "rev " + m.revision + " | " + m.last_sprint_closed + " -> " + m.next_sprint;

      const stack = document.getElementById("layer-stack");
      stack.innerHTML = "";
      (m.layers || []).slice().reverse().forEach((layer) => {
        const el = document.createElement("div");
        el.className = "layer-plane";
        el.dataset.layer = layer.id;
        el.textContent = layer.id + " " + layer.name;
        el.addEventListener("click", () => filterLayer(layer.id));
        stack.appendChild(el);
      });

      const list = document.getElementById("node-list");
      list.innerHTML = "";
      const select = document.getElementById("doc-select");
      select.innerHTML = '<option value="">doc</option>';

      (m.nodes || []).forEach((n) => {
        const li = document.createElement("li");
        li.dataset.layer = n.layer;
        const tag = document.createElement("span");
        tag.className = "layer-tag";
        tag.textContent = n.layer;
        li.appendChild(tag);
        const a = document.createElement("a");
        a.href = repoUrl(n.path);
        a.textContent = n.label;
        a.addEventListener("click", (e) => {
          e.preventDefault();
          openDoc(n.path, n.label);
        });
        li.appendChild(a);
        if (n.sprints && n.sprints.length) {
          const sp = document.createElement("span");
          sp.className = "sprints";
          sp.textContent = n.sprints.join(", ");
          li.appendChild(sp);
        }
        list.appendChild(li);

        if (n.path && n.path.endsWith(".md")) {
          const opt = document.createElement("option");
          opt.value = n.path;
          opt.textContent = n.label;
          select.appendChild(opt);
        }
      });

      document.getElementById("svg-img").src = VISION_BASE + "vision.svg?t=" + Date.now();
    }

    function filterLayer(layerId) {
      document.querySelectorAll("#node-list li").forEach((li) => {
        li.style.opacity = li.dataset.layer === layerId ? "1" : "0.3";
      });
    }

    function renderExtensions(ext) {
      const panel = document.getElementById("scope-panel");
      panel.innerHTML = "";
      const head = document.createElement("p");
      head.className = "meta";
      head.style.margin = "0 0 8px";
      head.textContent = "active: " + ext.active_sprint;
      panel.appendChild(head);

      Object.entries(ext.scopes || {}).forEach(([key, scope]) => {
        const det = document.createElement("details");
        det.className = "scope-item";
        det.open = key.indexOf("galaxy") >= 0;
        const sum = document.createElement("summary");
        sum.textContent = key;
        det.appendChild(sum);
        const body = document.createElement("div");
        body.className = "scope-body";
        body.innerHTML =
          "<div><b>ext:</b> " + (scope.extensions || []).join(", ") + "</div>" +
          "<div><b>docs:</b> " + (scope.docs || []).join(", ") + "</div>" +
          "<div><b>code:</b> " + (scope.code_globs || []).join(", ") + "</div>";
        det.appendChild(body);
        panel.appendChild(det);
      });
    }

    async function openDoc(path, label) {
      const hint = document.getElementById("doc-hint");
      const pre = document.getElementById("doc-preview");
      hint.textContent = label + " - " + path;
      pre.textContent = "loading...";
      try {
        const r = await fetch(repoUrl(path));
        if (!r.ok) throw new Error("HTTP " + r.status);
        const text = await r.text();
        const lines = text.split("\n");
        const clip = lines.length > 80 ? lines.slice(0, 80).join("\n") + "\n\n... (" + lines.length + " lines total)" : text;
        pre.textContent = clip;
      } catch (e) {
        pre.textContent = "Error: " + e.message;
      }
    }

    document.getElementById("doc-select").addEventListener("change", (e) => {
      const p = e.target.value;
      if (p) openDoc(p, p);
    });

    async function reloadAll() {
      try {
        const [manifest, extensions] = await Promise.all([
          loadJson("manifest.json"),
          loadJson("extensions.json"),
        ]);
        renderManifest(manifest);
        renderExtensions(extensions);
      } catch (err) {
        document.getElementById("meta-rev").innerHTML =
          '<span class="error">' + err.message + " - restart .\\bin\\open-docs-vision.ps1</span>";
      }
    }

    document.getElementById("btn-reload").addEventListener("click", reloadAll);
    reloadAll();
  </script>
</body>
</html>
