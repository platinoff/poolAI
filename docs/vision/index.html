<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PooaI Galazy Starwalker Vision</title>
  <link rel="stylesheet" href="vision.css?v=49" />
</head>
<body>
  <div id="galaxy-backdrop" class="galaxy-backdrop" aria-hidden="true">
    <img class="galaxy-backdrop-img" src="" alt="" />
  </div>
  <canvas id="starfield" aria-hidden="true"></canvas>
  <header>
    <button type="button" id="btn-sidebar" title="Toggle Explorer (overlay in fullscreen)">☰</button>
    <h1>PooaI Galazy Starwalker Vision</h1>
    <span class="meta" id="meta-rev">…</span>
    <span class="meta-trail" id="meta-trail" aria-label="Git HEAD and next sprint"></span>
    <button type="button" id="btn-auto" class="btn-auto on" title="Auto-reload when vision files change">Auto</button>
    <button type="button" id="btn-reload" title="Reload manifest.json">↻ Reload</button>
  </header>
  <div class="workspace">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-head">
        <button type="button" id="btn-sidebar2" title="Collapse">◀</button>
        <span class="sidebar-title"><span>Explorer</span> <span class="sprint-pill" id="sidebar-sprint" hidden></span></span>
      </div>
      <div class="sidebar-body" id="file-tree"></div>
    </aside>
    <div class="main-col">
      <div class="diagram-row">
        <section class="panel" data-panel="layers" aria-label="Layer stack">
          <h2><span>Layers</span><button type="button" class="btn-panel-fs" title="Fullscreen (Esc)">⛶</button></h2>
          <div class="panel-body" id="graph-3d">
            <div class="layer-stack" id="layer-stack"></div>
          </div>
          <div class="legend-bar" id="layer-legend" aria-label="Layer legend"></div>
        </section>
        <section class="panel" data-panel="map" aria-label="Interactive map">
          <h2><span>Galaxy map</span><button type="button" class="btn-panel-fs" title="Fullscreen (Esc)">⛶</button></h2>
          <div class="panel-body map-wrap">
            <img class="galaxy-bg" src="" alt="" />
            <div class="map-toolbar" aria-label="Map filters">
              <button type="button" id="btn-map-sprint" class="btn-map-toggle" title="Dim nodes outside active sprint (PH-S*)">◎ Sprint</button>
              <button type="button" id="btn-map-clusters" class="btn-map-toggle on" title="Collapse folders with 5+ files">⊟ Folders</button>
            </div>
            <div class="map-controls" aria-label="Map zoom">
              <button type="button" id="map-zoom-in" title="Zoom in">+</button>
              <button type="button" id="map-zoom-out" title="Zoom out">−</button>
              <button type="button" id="map-zoom-reset" title="Reset view">⌂</button>
            </div>
            <span class="map-hint">constellation · click pipelines · layers · zoom</span>
            <svg id="map-svg" viewBox="0 0 900 520" role="img" aria-label="Documentation graph"></svg>
          </div>
        </section>
        <section class="panel" data-panel="links" aria-label="Links">
          <h2><span>Links</span><button type="button" class="btn-panel-fs" title="Fullscreen (Esc)">⛶</button></h2>
          <div class="panel-body">
            <svg id="link-graph" aria-label="Neighbour graph"></svg>
            <ul class="links-list" id="links-list"></ul>
            <div class="sprint-chips" id="sprint-chips"></div>
          </div>
        </section>
      </div>
      <section class="panel preview-panel" data-panel="preview" aria-label="Document preview">
        <h2><span>Preview</span><button type="button" class="btn-panel-fs" title="Fullscreen (Esc)">⛶</button></h2>
        <div class="panel-body">
          <p id="doc-hint">Select a file in the sidebar or on the map.</p>
          <pre id="doc-preview"></pre>
        </div>
      </section>
    </div>
  </div>
  <script src="vision.js?v=49"></script>
</body>
</html>
