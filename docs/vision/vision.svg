<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">PoolAI Galaxy Starwalker Vision</title>
  <desc id="desc">Isometric L0-L3 layers with Galaxy Grid at center. PH-S1318 done, next PH-S1319.</desc>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06080f"/>
      <stop offset="50%" stop-color="#0f1419"/>
      <stop offset="100%" stop-color="#1a1030"/>
    </linearGradient>
    <radialGradient id="nebula" cx="50%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#3d5a8a" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#06080f" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="planeL0" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4a7ab8" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#1e3350" stop-opacity="0.85"/>
    </linearGradient>
    <linearGradient id="planeL1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4a8a50" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#2a4030" stop-opacity="0.85"/>
    </linearGradient>
    <linearGradient id="planeL2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a08040" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#403520" stop-opacity="0.85"/>
    </linearGradient>
    <linearGradient id="planeL3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a05078" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#402030" stop-opacity="0.85"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.5"/>
    </filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#c4a5ff"/>
    </marker>
  </defs>

  <rect width="1200" height="760" fill="url(#bg)"/>
  <rect width="1200" height="760" fill="url(#nebula)"/>

  <!-- stars -->
  <g fill="#e8f0ff" opacity="0.5">
    <circle cx="120" cy="80" r="1"/><circle cx="980" cy="120" r="1.2"/>
    <circle cx="200" cy="200" r="0.8"/><circle cx="1050" cy="280" r="1"/>
    <circle cx="80" cy="400" r="1"/><circle cx="1100" cy="500" r="0.9"/>
    <circle cx="400" cy="60" r="0.7"/><circle cx="700" cy="680" r="1.1"/>
  </g>

  <text x="600" y="42" text-anchor="middle" fill="#eef2ff" font-family="Segoe UI, system-ui, sans-serif" font-size="22" font-weight="600">PoolAI Galaxy Starwalker Vision</text>
  <text x="600" y="68" text-anchor="middle" fill="#8b9cb8" font-family="Segoe UI, system-ui, sans-serif" font-size="13">L0 Concept -> L3 Code - manifest-driven graph in browser</text>

  <g transform="translate(180, 100)" filter="url(#shadow)">
    <path d="M0 100 L400 0 L800 100 L400 200 Z" fill="url(#planeL0)" stroke="#90b8f0" stroke-width="2"/>
    <text x="400" y="108" text-anchor="middle" fill="#c8dcff" font-size="15" font-weight="700">L0 Concept</text>
    <g filter="url(#glow)">
      <rect x="220" y="42" width="360" height="52" rx="10" fill="#1a2848" stroke="#a78bfa" stroke-width="2"/>
      <text x="400" y="74" text-anchor="middle" fill="#fff" font-size="14" font-weight="700">POOLAI_GALAXY_GRID.md</text>
    </g>
    <text x="140" y="72" text-anchor="middle" fill="#9ab0d0" font-size="9">MEMORY</text>
    <text x="660" y="72" text-anchor="middle" fill="#9ab0d0" font-size="9">GRID_NODE</text>
  </g>

  <g transform="translate(200, 230)" filter="url(#shadow)">
    <path d="M0 80 L320 0 L640 80 L320 160 Z" fill="url(#planeL1)" stroke="#90c490" stroke-width="1.5"/>
    <text x="320" y="92" text-anchor="middle" fill="#d0f0d0" font-size="13" font-weight="600">L1 Operations</text>
    <text x="200" y="68" text-anchor="middle" fill="#fff" font-size="10">HANDOFF</text>
    <text x="440" y="68" text-anchor="middle" fill="#fff" font-size="10">NEXT_SESSION</text>
  </g>

  <g transform="translate(170, 340)" filter="url(#shadow)">
    <path d="M0 80 L340 0 L680 80 L340 160 Z" fill="url(#planeL2)" stroke="#c4b080" stroke-width="1.5"/>
    <text x="340" y="92" text-anchor="middle" fill="#f0e8c0" font-size="13" font-weight="600">L2 Catalog</text>
    <text x="240" y="68" text-anchor="middle" fill="#fff" font-size="10">FUNCTION_MANAGEMENT</text>
    <text x="440" y="68" text-anchor="middle" fill="#fff" font-size="10">DIGEST</text>
  </g>

  <g transform="translate(140, 450)" filter="url(#shadow)">
    <path d="M0 80 L360 0 L720 80 L360 160 Z" fill="url(#planeL3)" stroke="#c49ab0" stroke-width="1.5"/>
    <text x="360" y="92" text-anchor="middle" fill="#f0d0e0" font-size="13" font-weight="600">L3 Code</text>
    <text x="200" y="68" text-anchor="middle" fill="#fff" font-size="9">galaxy_fee_split.rs</text>
    <text x="360" y="68" text-anchor="middle" fill="#fff" font-size="9">dispatch.rs</text>
    <text x="520" y="68" text-anchor="middle" fill="#fff" font-size="9">virtual_nodes</text>
  </g>

  <g fill="none" stroke="#c4a5ff" stroke-width="1.5" marker-end="url(#arrow)" opacity="0.75">
    <path d="M580 210 L580 280"/>
    <path d="M580 280 L580 360"/>
    <path d="M580 360 L580 440"/>
    <path d="M520 200 L400 280" opacity="0.4"/>
    <path d="M640 200 L560 440" opacity="0.35"/>
  </g>

  <g transform="translate(48, 120)" font-family="Segoe UI, system-ui, sans-serif" font-size="11">
    <text x="0" y="0" fill="#eef2ff" font-weight="600" font-size="12">Legend</text>
    <rect x="0" y="12" width="12" height="12" rx="2" fill="#3d6a9e"/><text x="18" y="22" fill="#9aa0a6">Concept</text>
    <rect x="0" y="32" width="12" height="12" rx="2" fill="#3d6a4a"/><text x="18" y="42" fill="#9aa0a6">Operations</text>
    <rect x="0" y="52" width="12" height="12" rx="2" fill="#8a7040"/><text x="18" y="62" fill="#9aa0a6">Catalog</text>
    <rect x="0" y="72" width="12" height="12" rx="2" fill="#8a4068"/><text x="18" y="82" fill="#9aa0a6">Code</text>
    <text x="0" y="108" fill="#a78bfa">? implements / session-tracks</text>
  </g>

  <text x="600" y="738" text-anchor="middle" fill="#6a7a9a" font-family="Segoe UI, system-ui, sans-serif" font-size="12">PH-S1318 done sso docs canon - PH-S1319 next - 10 open - rev 361</text>
</svg>
