<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">PoolAI docs vision - layered map</title>
  <desc id="desc">Isometric layers L0 Concept through L3 Code. Galaxy Grid center.</desc>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f1419"/>
      <stop offset="100%" stop-color="#1a2332"/>
    </linearGradient>
    <linearGradient id="planeL0" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2d4a6f" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#1e3350" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="planeL1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3d5a40" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#2a4030" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="planeL2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5a4a2d" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#403520" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="planeL3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5a2d4a" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#402030" stop-opacity="0.9"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="3" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.4"/>
    </filter>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#8ab4f8"/>
    </marker>
  </defs>
  <rect width="1200" height="720" fill="url(#bg)"/>
  <text x="600" y="36" text-anchor="middle" fill="#e8eaed" font-family="Segoe UI, sans-serif" font-size="20" font-weight="600">PoolAI docs vision</text>
  <text x="600" y="58" text-anchor="middle" fill="#9aa0a6" font-family="Segoe UI, sans-serif" font-size="12">L0 Concept - L3 Code | manifest.json</text>

  <g transform="translate(200, 90)" filter="url(#shadow)">
    <path d="M0 90 L360 0 L720 90 L360 180 Z" fill="url(#planeL0)" stroke="#80a8e0" stroke-width="2"/>
    <text x="360" y="100" text-anchor="middle" fill="#c0d8ff" font-size="14" font-weight="700">L0 Concept</text>
    <rect x="160" y="40" width="400" height="44" rx="6" fill="#1e3350" stroke="#8ab4f8"/>
    <text x="360" y="67" text-anchor="middle" fill="#fff" font-size="13" font-weight="600">POOLAI_GALAXY_GRID.md</text>
  </g>

  <g transform="translate(180, 210)" filter="url(#shadow)">
    <path d="M0 70 L300 0 L600 70 L300 140 Z" fill="url(#planeL1)" stroke="#90c490" stroke-width="1.5"/>
    <text x="300" y="82" text-anchor="middle" fill="#d0f0d0" font-size="12" font-weight="600">L1 Operations</text>
    <text x="300" y="58" text-anchor="middle" fill="#fff" font-size="10">HANDOFF / NEXT_SESSION</text>
  </g>

  <g transform="translate(150, 310)" filter="url(#shadow)">
    <path d="M0 70 L320 0 L640 70 L320 140 Z" fill="url(#planeL2)" stroke="#c4b080" stroke-width="1.5"/>
    <text x="320" y="82" text-anchor="middle" fill="#f0e8c0" font-size="12" font-weight="600">L2 Catalog</text>
    <text x="320" y="58" text-anchor="middle" fill="#fff" font-size="10">FM / DIGEST</text>
  </g>

  <g transform="translate(120, 410)" filter="url(#shadow)">
    <path d="M0 70 L340 0 L680 70 L340 140 Z" fill="url(#planeL3)" stroke="#c49ab0" stroke-width="1.5"/>
    <text x="340" y="82" text-anchor="middle" fill="#f0d0e0" font-size="12" font-weight="600">L3 Code</text>
    <text x="340" y="58" text-anchor="middle" fill="#fff" font-size="10">grid / virtual_nodes</text>
  </g>

  <g fill="none" stroke="#8ab4f8" stroke-width="1.2" marker-end="url(#arrow)" opacity="0.7">
    <path d="M560 180 L560 250"/>
    <path d="M560 250 L560 330"/>
    <path d="M560 330 L560 410"/>
  </g>

  <g transform="translate(40, 90)" font-family="Segoe UI, sans-serif" font-size="11" fill="#9aa0a6">
    <text x="0" y="0" fill="#e8eaed" font-weight="600">Legend</text>
    <text x="0" y="20">Concept / Ops / Catalog / Code</text>
    <text x="0" y="38" fill="#8ab4f8">arrow = doc to code link</text>
  </g>

  <text x="600" y="700" text-anchor="middle" fill="#6a7a8a" font-family="Segoe UI, sans-serif" font-size="11">PH-S63 done | next PH-S64 | reload manifest in browser UI</text>
</svg>
