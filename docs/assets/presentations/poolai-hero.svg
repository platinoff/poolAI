<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 400" width="1280" height="400" role="img">
  <title>PoolAI — AI Mining Pool Management System</title>
  <desc>Distributed AI mining pool management. Rust-first. SMIL, no JavaScript.</desc>
  <defs>
