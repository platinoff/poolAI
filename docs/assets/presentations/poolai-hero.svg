      <stop offset="0%" stop-color="#080c04"/>
      <stop offset="55%" stop-color="#0e1206"/>
      <stop offset="100%" stop-color="#141a0a"/>
    </linearGradient>
    <radialGradient id="nebA" cx="28%" cy="42%" r="48%">
