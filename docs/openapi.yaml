components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT token obtained from /login endpoint

  parameters:
    PeerId:
      name: peer_id
      in: path
      required: true
      schema:
        type: string
      description: Virtual node / worker peer identifier

  schemas:
    StatusResponse:
      type: object
      properties:
        status:
          type: string
          example: running
        version:
          type: string
          example: "0.1.0"
        uptime:
          type: integer
          format: int64
          example: 3600

    HealthResponse:
      type: object
      properties:
        status:
          type: string
          example: healthy
        timestamp:
          type: string
          format: date-time
        version:
          type: string
          example: "0.1.0"
        uptime:
          type: integer
          format: int64
          example: 3600
        checks:
          type: object
          properties:
            database:
              $ref: '#/components/schemas/HealthCheck'
            memory:
              $ref: '#/components/schemas/HealthCheck'
            workers:
              $ref: '#/components/schemas/HealthCheck'
            gpu:
              $ref: '#/components/schemas/HealthCheck'

    HealthCheck:
      type: object
      properties:
        status:
          type: string
          example: healthy
        message:
          type: string
          example: "Database connection OK"
        response_time_ms:
          type: integer
          example: 5

    AuthRequest:
      type: object
      required:
        - username
        - password
      properties:
        username:
          type: string
          example: admin
        password:
          type: string
          format: password
          example: password123

    AuthResponse:
      type: object
      properties:
        token:
          type: string
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        token_type:
          type: string
          example: Bearer
        expires_in:
          type: integer
          example: 3600
        role:
          type: string
          enum: [Admin, Operator, Viewer]
          example: Admin

    MetricsResponse:
      type: object
      properties:
        active_workers:
          type: integer
          example: 8
        total_requests:
          type: integer
          format: int64
          example: 12345
        avg_response_time:
          type: number
          format: float
          example: 12.5

    ModelInfo:
      type: object
      properties:
        name:
          type: string
          example: gpt-4
        status:
          type: string
          example: loaded
        memory_usage:
          type: integer
          format: int64
          example: 8192

    WorkerInfo:
      type: object
      properties:
        id:
          type: string
          example: worker-1
        status:
          type: string
          description: idle, busy, or error
          example: idle
        current_task:
          type: string
          nullable: true
          example: task-123
        is_healthy:
          type: boolean
          example: true
        total_requests_processed:
