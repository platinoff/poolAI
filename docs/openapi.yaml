openapi: 3.0.3
info:
  title: PoolAI API
  description: |
    AI Mining Pool Management System with Generative Model Integration
    
    ## Authentication
    Most endpoints require JWT authentication. Include the token in the Authorization header:
    ```
    Authorization: Bearer <token>
    ```
    
    ## Roles and Permissions
    - **Admin**: Full access to all operations
    - **Operator**: Can perform write operations on VM instances and libraries
    - **Viewer**: Read-only access
    
    ## Base URL
    - Development: `http://localhost:8080/api/v1`
    - Production: `https://your-domain.com/api/v1`
  version: 0.1.0
  contact:
    name: PoolAI Team
    url: https://github.com/poolai/poolai
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

servers:
  - url: http://localhost:8080/api/v1
    description: Development server
  - url: https://your-domain.com/api/v1
    description: Production server
  - url: http://localhost:8080/api/enterprise
    description: Enterprise API (requires `enterprise` feature; AI/ML also needs `ml`)
  - url: https://your-domain.com/api/enterprise
    description: Enterprise API (production)

tags:
  - name: System
    description: System status and health checks
  - name: Authentication
    description: User authentication and authorization
  - name: Metrics
    description: System metrics and monitoring
  - name: Workers
    description: Worker pool management
  - name: GPU
    description: GPU information and management
  - name: Rewards
    description: Rewards system endpoints
  - name: Libraries
    description: Model library management
  - name: VM
    description: Virtual machine instance management
  - name: RAID
    description: Distributed storage management
  - name: WebSocket
    description: Real-time WebSocket endpoints
  - name: Discovery
    description: Peer discovery and virtual-node registration (FM-016)
  - name: VirtualNodes
    description: Virtual-node workers, tasks, pool join, Telegram bridge (FM-016+)
  - name: Admin
    description: Admin dashboard aggregation JSON
  - name: Topology
    description: Network topology and node resources
  - name: Instances
    description: ML model instance placement and lifecycle
  - name: Config
    description: PoolAI TOML configuration (GET public; PUT admin)
  - name: UI
    description: Dashboards, themes, and component registry (`src/network/api/ui.rs`)
  - name: Completions
    description: OpenAI-compatible chat completions
  - name: EnterpriseML
    description: Stage 4.4 AI/ML (`src/network/api/ai_ml.rs`, requires `enterprise` + `ml`)
  - name: EnterpriseAuth
    description: OAuth2/SAML browser flows (`src/network/enterprise_api/oauth.rs`, `saml.rs`)
  - name: EnterpriseMonitoring
    description: Alerts, dashboards, metrics, alert rules (`enterprise_api/monitoring.rs`)
  - name: EnterpriseSecurity
    description: OAuth2/SAML provider registry and policies (`enterprise_api/security.rs`)
  - name: EnterpriseTenants
    description: Multi-tenant lifecycle and quotas (`enterprise_api/tenants.rs`)
  - name: EnterpriseAudit
    description: Audit log query (`enterprise_api/audit.rs`)

paths:
  /status:
    get:
      tags:
        - System
      summary: Get server status
      description: Returns server status, version, and uptime
      operationId: getStatus
      responses:
        '200':
          description: Server status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusResponse'
            text/html:
              schema:
                type: string
                description: HTML status page

  /health:
    get:
      tags:
        - System
      summary: Health check endpoint
      description: Returns detailed health status for CI/CD and monitoring
      operationId: getHealth
      responses:
        '200':
          description: Health status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

  /login:
    post:
      tags:
        - Authentication
      summary: Authenticate user
      description: Authenticate user and receive JWT token
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthRequest'
      responses:
        '200':
          description: Authentication successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          description: Authentication failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /refresh:
    post:
      tags:
        - Authentication
      summary: Refresh access token
      description: |
        Issues a new access token from a bearer token that is still decodable (including
        expired sessions). User must still exist in the user store.
      operationId: refreshToken
      security:
        - bearerAuth: []
      responses:
        '200':
          description: New token issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          description: Missing header, invalid token, or user removed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /metrics:
    get:
      tags:
        - Metrics
      summary: Get system metrics
      description: Returns current system metrics
      operationId: getMetrics
      security:
        - bearerAuth: []
      responses:
        '200':
          description: System metrics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetricsResponse'

  /models:
    get:
      tags:
        - Metrics
      summary: Get model information
      description: Returns information about loaded models
      operationId: getModels
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Model information
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ModelInfo'

  /workers:
    get:
      tags:
        - Workers
      summary: Get worker information
      description: Returns information about worker pool
      operationId: getWorkers
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Worker information
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/WorkerInfo'

  /discovery/peers:
    get:
      tags:
        - Discovery
      summary: List discovered peers
      operationId: listDiscoveryPeers
      responses:
        '200':
          description: Peer snapshot
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiscoveryPeersResponse'
        '503':
          description: Discovery not initialized (empty peers, local_peer_id not-initialized)

  /discovery/peers/{peer_id}:
    get:
      tags:
        - Discovery
      summary: Get a single peer by id
      operationId: getDiscoveryPeer
      parameters:
        - name: peer_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Peer lookup result (peer may be null)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiscoveryPeerResponse'
        '503':
          description: Discovery not initialized

  /discovery/register:
    post:
      tags:
        - Discovery
      summary: Announce this coordinator as a peer
      description: Sends discovery announcement for the local node.
      operationId: registerDiscoveryLocal
      responses:
        '200':
          description: Announcement sent
        '503':
          description: Discovery service not ready

  /discovery/register-remote:
    post:
      tags:
        - Discovery
      summary: Register a remote virtual node
      description: HTTP registration for device workers (`metadata.role` = `virtual_node`). Queues bootstrap tasks.
      operationId: registerRemotePeer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRemotePeerRequest'
      responses:
        '200':
          description: Peer registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterRemotePeerResponse'
        '400':
          description: Invalid request

  /discovery/heartbeat-remote:
    post:
      tags:
        - Discovery
      summary: Heartbeat from a remote peer
      operationId: heartbeatRemotePeer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HeartbeatRemotePeerRequest'
      responses:
        '200':
          description: Heartbeat accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HeartbeatRemotePeerResponse'

  /discovery/virtual-nodes:
    get:
      tags:
        - Discovery
      summary: List registered virtual nodes
      operationId: listVirtualNodes
      responses:
        '200':
          description: Virtual node list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VirtualNodesListResponse'

  /discovery/virtual-nodes/{peer_id}/health:
    get:
      tags:
        - Discovery
      summary: Probe virtual node worker HTTP health
      operationId: probeVirtualNodeHealth
      parameters:
        - name: peer_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Worker reachable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RemoteHealthProbe'
        '404':
          description: Peer not found or unreachable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RemoteHealthProbe'
        '503':
          description: Probe failed (unreachable) or discovery not ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RemoteHealthProbe'

  /virtual-nodes/{peer_id}/tasks/poll:
    get:
      tags:
        - VirtualNodes
      summary: Poll next task for a virtual node
      operationId: pollVirtualNodeTask
      parameters:
        - $ref: '#/components/parameters/PeerId'
      responses:
        '200':
          description: Poll result (task may be null)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PollVirtualNodeTasksResponse'

  /virtual-nodes/{peer_id}/tasks/status:
    get:
      tags:
        - VirtualNodes
      summary: Task queue status for a peer
      operationId: virtualNodeTaskStatus
      parameters:
        - $ref: '#/components/parameters/PeerId'
      responses:
        '200':
          description: Pending and completed counts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VirtualNodeTaskStatusResponse'

  /virtual-nodes/{peer_id}/tasks:
    post:
      tags:
        - VirtualNodes
      summary: Enqueue a task for a virtual node
      operationId: enqueueVirtualNodeTask
      parameters:
        - $ref: '#/components/parameters/PeerId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EnqueueVirtualNodeTaskRequest'
      responses:
        '201':
          description: Task created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnqueueVirtualNodeTaskResponse'

  /virtual-nodes/{peer_id}/tasks/{task_id}/complete:
    post:
      tags:
        - VirtualNodes
      summary: Report task completion
      operationId: completeVirtualNodeTask
      parameters:
        - $ref: '#/components/parameters/PeerId'
        - name: task_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompleteVirtualNodeTaskRequest'
      responses:
        '200':
          description: Completion recorded

  /virtual-nodes/{peer_id}/pool/join:
    post:
      tags:
        - VirtualNodes
      summary: Join coordinator worker pool
      description: Requires peer registered as virtual_node in discovery. No JWT.
      operationId: virtualNodePoolJoin
      parameters:
        - $ref: '#/components/parameters/PeerId'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VirtualNodePoolJoinRequest'
      responses:
        '201':
          description: Joined pool
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VirtualNodePoolJoinResponse'
        '403':
          description: Peer is not a virtual node
        '404':
          description: Peer not found
        '503':
          description: Pool not initialized

  /virtual-nodes/telegram/bind:
    post:
      tags:
        - VirtualNodes
      summary: Bind Telegram user to virtual node peer
      operationId: bindTelegramVirtualNode
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BindTelegramVirtualNodeRequest'
      responses:
        '200':
          description: Binding created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BindTelegramVirtualNodeResponse'

  /virtual-nodes/telegram/bindings:
    get:
      tags:
        - VirtualNodes
      summary: List all Telegram bindings
      operationId: listTelegramVirtualNodeBindings
      responses:
        '200':
          description: Binding list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TelegramBindingsListResponse'

  /virtual-nodes/telegram/bindings/{telegram_user_id}:
    get:
      tags:
        - VirtualNodes
      summary: Lookup Telegram binding
      operationId: getTelegramVirtualNodeBinding
      parameters:
        - name: telegram_user_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Binding found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TelegramBinding'
        '404':
          description: No binding
    delete:
      tags:
        - VirtualNodes
      summary: Remove Telegram binding
      operationId: unbindTelegramVirtualNode
      parameters:
        - name: telegram_user_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Binding removed
        '404':
          description: No binding

  /virtual-nodes/telegram/webhook:
    post:
      tags:
        - VirtualNodes
      summary: Telegram bot webhook (enqueue task)
      description: Optional header `X-Telegram-Webhook-Secret` when `POOLAI_TELEGRAM_WEBHOOK_SECRET` is set. Message text capped at 4096 chars.
      operationId: telegramVirtualNodeWebhook
      parameters:
        - name: X-Telegram-Webhook-Secret
          in: header
          required: false
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TelegramWebhookUpdate'
      responses:
        '200':
          description: Update processed
        '401':
          description: Invalid webhook secret

  /admin/overview:
    get:
      tags:
        - Admin
      summary: Admin dashboard overview
      description: Aggregated counts and subsystem flags for `/ui/admin`.
      operationId: getAdminOverview
      responses:
        '200':
          description: Overview snapshot
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminOverview'

  /topology:
    get:
      tags:
        - Topology
      summary: Network topology snapshot
      operationId: getTopology
      responses:
        '200':
          description: Topology overview
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TopologyOverviewResponse'
        '503':
          description: Topology service not ready

  /topology/latency:
    get:
      tags:
        - Topology
      summary: Latency matrix between nodes
      operationId: getTopologyLatencyMatrix
      responses:
        '200':
          description: Latency matrix (ms), keys `node_a:node_b`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TopologyLatencyMatrixResponse'
        '503':
          description: Topology service not ready

  /topology/nodes:
    get:
      tags:
        - Topology
      summary: Resources for all topology nodes
      operationId: getTopologyAllNodeResources
      responses:
        '200':
          description: Per-node resource snapshot
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TopologyAllNodesResourcesResponse'
        '503':
          description: Topology service not ready

  /topology/nodes/{node_id}:
    get:
      tags:
        - Topology
      summary: Resources for one topology node
      operationId: getTopologyNodeResources
      parameters:
        - name: node_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Node resources
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TopologyNodeResourcesResponse'
        '404':
          description: Node not found
        '503':
          description: Topology service not ready

  /instance/previews:
    get:
      tags:
        - Instances
      summary: Placement previews for a model
      operationId: getInstancePreviews
      parameters:
        - name: model_id
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Preview rows per sharding strategy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstancePreviewResponse'
        '400':
          description: Missing model_id
        '503':
          description: Instance manager not initialized

  /instance:
    get:
      tags:
        - Instances
      summary: List model instances
      operationId: listModelInstances
      responses:
        '200':
          description: Instance list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstanceListResponse'
        '503':
          description: Instance manager not initialized
    post:
      tags:
        - Instances
      summary: Create a model instance
      operationId: createModelInstance
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateModelInstanceRequest'
      responses:
        '200':
          description: Create command accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateModelInstanceResponse'
        '503':
          description: Instance manager not initialized

  /instance/{id}:
    get:
      tags:
        - Instances
      summary: Get model instance by id
      operationId: getModelInstance
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Instance details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelInstanceInfo'
        '404':
          description: Instance not found
        '503':
          description: Instance manager not initialized
    delete:
      tags:
        - Instances
      summary: Delete model instance
      operationId: deleteModelInstance
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Instance deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Instance deleted
        '503':
          description: Instance manager not initialized

  /state:
    get:
      tags:
        - Instances
      summary: Deployment state map
      description: Per-instance deployment state from the instance manager.
      operationId: getInstanceDeploymentState
      responses:
        '200':
          description: State keyed by instance id
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '503':
          description: Instance manager not initialized

  /gpu:
    get:
      tags:
        - GPU
      summary: Get GPU information
      description: Returns GPU hardware information
      operationId: getGpuInfo
      security:
        - bearerAuth: []
      responses:
        '200':
          description: GPU information
          content:
            application/json:
              schema:
                type: object

  /rewards:
    get:
      tags:
        - Rewards
      summary: Get rewards statistics
      description: Returns overall rewards system statistics
      operationId: getRewards
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Rewards statistics
          content:
            application/json:
              schema:
                type: object

  /rewards/{user_id}:
    get:
      tags:
        - Rewards
      summary: Get user rewards
      description: Returns rewards for a specific user
      operationId: getUserRewards
      security:
        - bearerAuth: []
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: User rewards
          content:
            application/json:
              schema:
                type: object

  /rewards/progress/{user_id}:
    get:
      tags:
        - Rewards
      summary: Get user progress
      description: Returns progress information for a specific user
      operationId: getUserProgress
      security:
        - bearerAuth: []
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: User progress
          content:
            application/json:
              schema:
                type: object
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /rewards/statistics:
    get:
      tags:
        - Rewards
      summary: Get rewards statistics
      description: Returns detailed rewards statistics
      operationId: getRewardsStatistics
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Rewards statistics
          content:
            application/json:
              schema:
                type: object

  /rewards/top:
    get:
      tags:
        - Rewards
      summary: Get top users
      description: Returns top users by rewards
      operationId: getTopUsers
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Top users
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object

  /libraries:
    get:
      tags:
        - Libraries
      summary: List libraries
      description: Returns list of all available libraries
      operationId: listLibraries
      security:
        - bearerAuth: []
      responses:
        '200':
          description: List of libraries
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
        '503':
          description: Service unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /libraries/{name}:
    get:
      tags:
        - Libraries
      summary: Get library information
      description: Returns detailed information about a specific library
      operationId: getLibraryInfo
      security:
        - bearerAuth: []
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Library information
          content:
            application/json:
              schema:
                type: object
        '404':
          description: Library not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /libraries/{name}/install:
    post:
      tags:
        - Libraries
      summary: Install library
      description: Install a library (requires Operator or Admin role)
      operationId: installLibrary
      security:
        - bearerAuth: []
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                version:
                  type: string
                  description: Optional version to install
      responses:
        '200':
          description: Library installed successfully
          content:
            application/json:
              schema:
                type: object
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden - insufficient permissions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /libraries/{name}/uninstall:
    post:
      tags:
        - Libraries
      summary: Uninstall library
      description: Uninstall a library (requires Operator or Admin role)
      operationId: uninstallLibrary
      security:
        - bearerAuth: []
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Library uninstalled successfully
          content:
            application/json:
              schema:
                type: object
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden - insufficient permissions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /libraries/{name}/update:
    post:
      tags:
        - Libraries
      summary: Update library
      description: Update a library to the latest version (requires Operator or Admin role)
      operationId: updateLibrary
      security:
        - bearerAuth: []
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Library updated successfully
          content:
            application/json:
              schema:
                type: object
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden - insufficient permissions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /vm/instances:
    get:
      tags:
        - VM
      summary: List VM instances
      description: Returns list of all VM instances
