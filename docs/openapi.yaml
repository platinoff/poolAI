    NetworkIsolationConfig:
      type: object
      description: Network isolation settings (`src/vm/isolation.rs` `NetworkIsolationConfig`)
      required:
        - enabled
        - allowed_interfaces
        - allowed_ports
        - allow_loopback
        - strict
      properties:
        enabled:
          type: boolean
          description: Whether network isolation is enabled
          example: true
        allowed_interfaces:
          type: array
          description: Allowed network interfaces (empty = all blocked when enabled)
          items:
            type: string
          example: ["eth0"]
        allowed_ports:
          type: array
          description: Allowed ports (empty = all blocked when enabled)
          items:
            type: integer
            format: int32
            minimum: 0
            maximum: 65535
          example: [80, 443]
        allow_loopback:
          type: boolean
          description: Allow loopback (`lo`) in the network namespace
          example: true
        interface_mode:
          type: string
          enum: [veth, macvlan]
          default: veth
          description: Attach allowed interfaces via veth (default) or macvlan (Linux)
        macvlan_mode:
          type: string
          description: Macvlan mode when interface_mode is macvlan
          enum: [bridge, private, vepa, passthru]
          example: bridge
        macvlan_address:
          type: string
          description: Optional static CIDR for macvlan interfaces
          example: "192.168.1.100/24"
        strict:
          type: boolean
          description: Fail if isolation cannot be applied (default false = graceful degradation)
          example: false

