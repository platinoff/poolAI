      summary: Register a remote virtual node
      description: |
        HTTP registration for device workers (`metadata.role` = `virtual_node`). Queues bootstrap tasks.
        Galaxy §9.3 — optional `protocol_version` / `build_id` trigger compat negotiation
        (`compat_status`: `accepted` | `upgrade_required` | `unsupported`).
      operationId: registerRemotePeer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRemotePeerRequest'
      responses:
        '200':
          description: Peer registered (full compatibility)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterRemotePeerResponse'
        '400':
          description: Invalid request
        '403':
          description: Protocol unsupported (compat matrix reject)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterRemotePeerResponse'
        '426':
          description: Peer registered with limited compatibility (upgrade recommended)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterRemotePeerResponse'

