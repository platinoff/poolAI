        `{"RoundRobin":null}`, `{"PriorityBased":{"priority":10}}`.
      oneOf:
        - type: object
          required: [RoundRobin]
          properties:
            RoundRobin:
              type: 'null'
        - type: object
          required: [PriorityBased]
          properties:
            PriorityBased:
              type: object
              required: [priority]
              properties:
                priority:
                  type: integer
                  minimum: 1
                  maximum: 100
        - type: object
          required: [LoadBased]
          properties:
            LoadBased:
              type: 'null'
        - type: object
          required: [Exclusive]
          properties:
            Exclusive:
              type: 'null'

