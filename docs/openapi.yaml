          type: string
          enum: [job]
        job_id:
          type: string
        task_kind:
          type: string
          description: Task kind (`inference`, `training`, `memory`, `system`, …)
        verification_policy:
          type: string
          nullable: true
        input_artifact_ids:
          type: array
          items:
            type: string
        deadline:
          type: string
          format: date-time
          nullable: true

    GridResultBody:
      type: object
      description: Grid job execution result (PH-S110 lease_epoch CAS on leased jobs)
      required:
        - type
        - job_id
        - status
      properties:
        type:
          type: string
          enum: [result]
        job_id:
          type: string
        status:
          $ref: '#/components/schemas/GridResultStatus'
        output_artifact_ids:
          type: array
          items:
            type: string
        proof:
          type: string
          nullable: true
        metrics:
          type: object
          nullable: true
          additionalProperties: true
        lease_epoch:
          type: integer
          format: int64
          minimum: 0
          nullable: true
          description: |
            Galaxy §4.3.1 CAS — must match active `lease_epoch` when job has lease fields (PH-S110);
            omit only for jobs without lease. Mismatch or missing epoch on leased job → `409 lease_epoch_rejected`.

