openapi: 3.0.3
info:
  title: PoolAI API
  description: |
    AI Mining Pool Management System with Generative Model Integration
    
    ## Authentication
    Most endpoints require JWT authentication. Include the token in the Authorization header:
    ```
    Authorization: Bearer <token>
    ```
    
    ## Roles and Permissions
    - **Admin**: Full access to all operations
    - **Operator**: Can perform write operations on VM instances and libraries
    - **Viewer**: Read-only access
    
    ## Base URL
    - Development: `http://localhost:8080/api/v1`
    - Production: `https://your-domain.com/api/v1`
  version: 0.1.0
  contact:
    name: PoolAI Team
    url: https://github.com/poolai/poolai
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

servers:
  - url: http://localhost:8080/api/v1
    description: Development server
  - url: https://your-domain.com/api/v1
    description: Production server
  - url: http://localhost:8080/api/enterprise
    description: Enterprise API (requires `enterprise` feature; AI/ML also needs `ml`)
  - url: https://your-domain.com/api/enterprise
    description: Enterprise API (production)

tags:
  - name: System
    description: System status and health checks
  - name: Authentication
    description: User authentication and authorization
  - name: Metrics
    description: System metrics and monitoring
  - name: Workers
    description: Worker pool management
  - name: Users
    description: User accounts and RBAC (`src/network/api/users.rs`)
  - name: GPU
    description: GPU information and management
  - name: Rewards
    description: Rewards system endpoints
  - name: Libraries
    description: Model library management
  - name: VM
    description: Virtual machine instance management
  - name: RAID
    description: Distributed storage management
  - name: RAID Admin
    description: RAID strategy control plane (`src/network/api/raid_admin.rs`)
  - name: RAID Distributed
    description: |
      Inter-node distributed RAID wire protocol (`src/network/raid_distributed_handlers.rs`).
      No JWT — intended for node-to-node replication on a trusted LAN.
      x-internal
  - name: WebSocket
    description: Real-time WebSocket endpoints
  - name: Jobs
    description: |
      Job / mining layer (`src/network/api/jobs.rs`, `src/job/`): list, create, schedule tick, lifecycle PATCH (FM-020…029).
      Persistence — `JobStoreBackend` schema; env `POOLAI_JOB_STORE`, `POOLAI_JOB_DATA_DIR`, `POOLAI_RAID_BASE_PATH` (PH-S48 RAID snapshot).
  - name: Memory
    description: AGI memory shard refs mapped to RAID artifacts (FM-022)
  - name: Grid
    description: Grid envelope v1 ingress — Job/Result/MemoryShard wire (FM-023)
  - name: Discovery
    description: Peer discovery and virtual-node registration (FM-016)
  - name: VirtualNodes
    description: Virtual-node workers, tasks, pool join, Telegram bridge (FM-016+)
  - name: Admin
    description: Admin dashboard aggregation JSON
  - name: Topology
    description: Network topology and node resources
  - name: Instances
    description: ML model instance placement and lifecycle
  - name: Config
    description: PoolAI TOML configuration (GET public; PUT admin)
  - name: UI
    description: Dashboards, themes, and component registry (`src/network/api/ui.rs`)
  - name: Completions
    description: OpenAI-compatible chat completions
  - name: EnterpriseML
    description: Stage 4.4 AI/ML (`src/network/api/ai_ml.rs`, requires `enterprise` + `ml`)
  - name: EnterpriseAuth
    description: OAuth2/SAML browser flows (`src/network/enterprise_api/oauth.rs`, `saml.rs`)
  - name: EnterpriseMonitoring
    description: Alerts, dashboards, metrics, alert rules (`enterprise_api/monitoring.rs`)
  - name: EnterpriseSecurity
    description: OAuth2/SAML provider registry and policies (`enterprise_api/security.rs`)
  - name: EnterpriseTenants
    description: Multi-tenant lifecycle and quotas (`enterprise_api/tenants.rs`)
  - name: EnterpriseAudit
    description: Audit log query (`enterprise_api/audit.rs`)
  - name: Ops
    description: Dev-stand operator controls (PH-S1016 power)

paths:
  /status:
    get:
      tags:
        - System
      summary: Get server status
      description: Returns server status, version, and uptime
      operationId: getStatus
      responses:
        '200':
          description: Server status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusResponse'
            text/html:
              schema:
                type: string
                description: HTML status page

  /health:
    get:
      tags:
        - System
      summary: Health check endpoint
      description: Returns detailed health status for CI/CD and monitoring
      operationId: getHealth
      responses:
        '200':
          description: Health status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

  /ops/power:
    post:
      tags:
        - Ops
      summary: Dev-stand power control
      description: |
        Queue shutdown or reboot for the PoolAI coordinator (dev-stand safe — host reboot skipped).
      operationId: postOpsPower
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OpsPowerRequest'
            example:
              action: shutdown
      responses:
        '202':
          description: Power action accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpsPowerResponse'
              example:
                accepted: true
                action: shutdown
                dev_guard: true
                note: Dev-stand safe — host reboot skipped
        '400':
          description: Invalid action
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /login:
    post:
      tags:
        - Authentication
      summary: Authenticate user
      description: Authenticate user and receive JWT token
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthRequest'
      responses:
        '200':
          description: Authentication successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          description: Authentication failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /refresh:
    post:
      tags:
        - Authentication
      summary: Refresh access token
      description: |
        Issues a new access token from a bearer token that is still decodable (including
        expired sessions). User must still exist in the user store.
      operationId: refreshToken
      security:
        - bearerAuth: []
      responses:
        '200':
          description: New token issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          description: Missing header, invalid token, or user removed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /metrics:
    get:
      tags:
        - Metrics
      summary: Get system metrics
      description: Returns current system metrics
      operationId: getMetrics
      security:
        - bearerAuth: []
      responses:
        '200':
          description: System metrics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetricsResponse'

  /models:
    get:
      tags:
        - Metrics
      summary: Get model information
      description: Returns information about loaded models
      operationId: getModels
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Model information
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ModelInfo'

  /workers:
    get:
      tags:
        - Workers
      summary: Get worker information
      description: Returns information about worker pool
      operationId: getWorkers
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Worker information
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/WorkerInfo'
    post:
      tags:
        - Workers
      summary: Register a worker in the pool
      description: Creates a worker entry (`src/network/api/workers.rs`). Requires JWT.
      operationId: createWorker
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateWorkerRequest'
      responses:
        '201':
          description: Worker created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateWorkerResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Worker pool not initialized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /workers/{id}:
    delete:
      tags:
        - Workers
      summary: Remove a worker from the pool
      operationId: deleteWorker
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Worker identifier
      responses:
        '200':
          description: Worker removed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteWorkerResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Worker not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Worker pool not initialized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /jobs:
    get:
      tags:
        - Jobs
      summary: List jobs
      description: Lists jobs from the in-process `JobStore`. Backend resolved at coordinator start — see `JobStoreBackend` and Jobs tag.
      operationId: listJobs
      responses:
        '200':
          description: Job list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobsListResponse'
    post:
      tags:
        - Jobs
      summary: Submit a job
      description: Creates job as `submitted` and persists via `JobStore` (`JobStoreBackend`). Scheduler promotes to `scheduled` and binds pool worker / running VM when available (FM-034).
      operationId: createJob
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateJobRequest'
      responses:
        '201':
          description: Job created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobSummary'
        '500':
          description: Internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /jobs/schedule:
    post:
      tags:
        - Jobs
      summary: Run scheduler tick
      description: Promotes all `submitted` jobs to `scheduled` (priority descending), binds pool workers / running VMs (FM-034), persists store updates (`JobStoreBackend`). Idempotent for already scheduled rows.
      operationId: scheduleJobs
      responses:
        '200':
          description: Scheduler tick result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScheduleJobsResponse'
        '500':
          description: Internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /jobs/{id}:
    get:
      tags:
        - Jobs
      summary: Get job by id
      description: Returns `JobRecord` from `JobStore` (see `JobStoreBackend`).
      operationId: getJob
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Job detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobDetailResponse'
        '404':
          description: Job not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    patch:
      tags:
        - Jobs
      summary: Update job status
      description: Lifecycle transition per JOB_LAYER_CONCEPT §2.2 (forward path + `failed` from non-terminal states). Persists via `JobStore` (`JobStoreBackend`).
      operationId: patchJob
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchJobRequest'
      responses:
        '200':
          description: Updated job
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobDetailResponse'
        '400':
          description: Invalid lifecycle transition
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Job not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /jobs/{id}/lease:
    post:
      tags:
        - Jobs
      summary: Acquire job lease
      description: |
        Galaxy §4.3.1 explicit lease acquire (PH-S98). Sets `lease_owner`, bumps `lease_epoch`,
        and `lease_expires_at` from `POOLAI_JOB_LEASE_TTL_SECS` (`JobLeaseConfig`). Scheduler tick
        also acquires when binding `worker_id`/`vm_id` without an active lease.
      operationId: acquireJobLease
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AcquireJobLeaseRequest'
            example:
              lease_owner: worker-a
      responses:
        '200':
          description: Lease acquired
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobDetailResponse'
              example:
                job:
                  spec:
                    id: job-lease-example
                    kind: inference
                    priority: 5
                    resources: {}
                    input_artifact_ids: [artifact-1]
                  status: leased
                  created_at: '2026-05-28T12:00:00Z'
                  lease_owner: worker-a
                  lease_epoch: 1
                  lease_expires_at: '2026-05-28T12:05:00Z'
        '400':
          description: Missing lease owner when job has no worker/vm binding
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Job not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Active lease already held (`lease_already_active`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: lease_already_active
                  message: active lease already held for job 'job-lease-example' (Galaxy §4.3.1)
        '500':
          description: Internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /jobs/{id}/lease/renew:
    post:
      tags:
        - Jobs
      summary: Renew job lease (heartbeat)
      description: |
        Galaxy §4.3.1 lease renew (PH-S99). Extends `lease_expires_at` when `lease_epoch` matches
        and lease is still active; uses `POOLAI_JOB_LEASE_TTL_SECS` (`JobLeaseConfig`).
      operationId: renewJobLease
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RenewJobLeaseRequest'
            example:
              lease_epoch: 1
      responses:
        '200':
          description: Lease renewed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobDetailResponse'
              example:
                job:
                  spec:
                    id: job-lease-example
                    kind: inference
                    priority: 5
                    resources: {}
                    input_artifact_ids: [artifact-1]
                  status: leased
                  created_at: '2026-05-28T12:00:00Z'
                  lease_owner: worker-a
                  lease_epoch: 1
                  lease_expires_at: '2026-05-28T12:10:00Z'
        '400':
          description: Job has no lease fields
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Job not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Epoch mismatch or lease expired (`lease_epoch_rejected`, `lease_expired`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                lease_epoch_rejected:
                  summary: Stale lease_epoch on renew
                  value:
                    error:
                      code: lease_epoch_rejected
                      message: lease_epoch does not match active lease for job 'job-lease-example' (Galaxy §4.3.1)
                lease_expired:
                  summary: Lease TTL elapsed
                  value:
                    error:
                      code: lease_expired
                      message: lease expired for job 'job-lease-example' (Galaxy §4.3.1)
        '500':
          description: Internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /grid/envelope:
    post:
      tags:
        - Grid
      summary: Ingest Grid envelope v1
      description: |
        Dispatches `GridEnvelope` by `type`: `job` → job store + scheduler;
        `result` → job status update (optional `lease_epoch` CAS when job is leased, PH-S110);
        `memory_shard` → memory store; `peer_status` → ack only.
      operationId: ingestGridEnvelope
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GridEnvelope'
            examples:
              result_with_lease_epoch:
                summary: Result with matching lease_epoch (PH-S110 CAS)
                value:
                  v: 1
                  sent_at: '2026-05-28T12:01:00Z'
                  type: result
                  job_id: job-grid-lease-1
                  status: completed
                  output_artifact_ids: [out-artifact-1]
                  lease_epoch: 2
      responses:
        '200':
          description: Envelope processed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GridIngestResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Referenced job not found (result ingress)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Lease epoch CAS rejected on result ingest (`lease_epoch_rejected`, PH-S110)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: lease_epoch_rejected
                  message: lease_epoch does not match active lease for job 'job-grid-lease-1' (Galaxy §4.3.1)

  /grid/pricing:
    get:
      tags:
        - Grid
      summary: Get grid pricing snapshot
      description: |
        Read-only pricing snapshot for `(task_profile, model_profile, unit_key)`.
        Uses in-process Galaxy pricing oracle cache first, then fallback quote path.
      operationId: getGridPricingSnapshot
      parameters:
        - name: task_profile
          in: query
          required: true
          schema:
            type: string
        - name: model_profile
          in: query
          required: true
          schema:
            type: string
        - name: unit_key
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/GalaxyPriceUnitKey'
      responses:
        '200':
          description: Pricing snapshot
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GridPricingSnapshotResponse'
        '400':
          description: Invalid query (for example unsupported unit_key)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Pricing unavailable (L3 hard stop — no L1 cache and no L2 fallback)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: pricing_unavailable
                  message: grid pricing unavailable; configure POOLAI_GALAXY_PRICING_FALLBACK_JSON

  /grid/seed-inventory:
    get:
      tags:
        - Grid
      summary: List coordinator seed inventory snapshot
      description: |
        Read-only stub listing worker `seed_inventory` rows for Galaxy locality / prefetch discovery (§5.5).
        Coordinator-side snapshot; no live worker poll wire in PH-S195.
      operationId: getGridSeedInventory
      responses:
        '200':
          description: Seed inventory snapshot
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GridSeedInventoryResponse'

  /grid/verification-replay:
    get:
      tags:
        - Grid
      summary: Last verification replay record (PH-S460)
      operationId: getGridVerificationReplay
      responses:
        '200':
          description: Verification replay snapshot
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GridVerificationReplayResponse'

  /grid/verification-replay/history:
    get:
      tags:
        - Grid
      summary: Verification replay history (PH-S478)
      operationId: getGridVerificationReplayHistory
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 10
            minimum: 1
            maximum: 32
      responses:
        '200':
          description: Verification replay history snapshot
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GridVerificationReplayHistoryResponse'

  /grid/verification-checker/tasks:
    get:
      tags:
        - Grid
      summary: Pending verification checker stub tasks (PH-S494)
      operationId: getGridVerificationCheckerTasks
      responses:
        '200':
          description: Pending checker tasks snapshot
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GridVerificationCheckerTasksResponse'

  /grid/verification-metrics:
    get:
      tags:
        - Grid
      summary: Verification counters snapshot (PH-S670)
      operationId: getGridVerificationMetrics
      responses:
        '200':
          description: Verification metrics snapshot
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GridVerificationMetricsResponse'
              example:
                ok: true
                metrics:
                  sample_total: 0
                  match_total: 0
                  mismatch_total: 0
                  sample_scheduled_total: 0

  /grid/replay-metrics:
    get:
      tags:
        - Grid
      summary: Replay counters snapshot (PH-S671)
      operationId: getGridReplayMetrics
      responses:
        '200':
          description: Replay metrics snapshot
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GridReplayMetricsResponse'
              example:
                ok: true
                metrics:
                  replay_pending: 0
                  replay_pending_scheduled_total: 0
                  replay_pending_resolved_total: 0
                  replay_evaluations_total: 0
                  replay_verification_enqueue_total: 0
                  verification_replay_record_total: 0

  /grid/settlement-metrics:
    get:
      tags:
        - Grid
      summary: Settlement counters snapshot (PH-S680)
      operationId: getGridSettlementMetrics
      responses:
        '200':
          description: Settlement metrics snapshot
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GridSettlementMetricsResponse'
              example:
                ok: true
                metrics:
                  pending_verification_total: 0
                  cleared_total: 0
                  not_applicable_total: 0
                  resolved_total: 0
                  payout_batch_total: 0
                  human_review_total: 0

  /grid/trust-metrics:
    get:
      tags:
        - Grid
      summary: Trust gate counters snapshot (PH-S681)
      operationId: getGridTrustMetrics
      responses:
        '200':
          description: Trust metrics snapshot
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GridTrustMetricsResponse'
              example:
                ok: true
                trust_persist_depth: ephemeral
                trust_store_backend: ephemeral
                persisted_peer_count: 0
                metrics:
                  payout_eligible_total: 0
                  payout_held_total: 0
                  last_trust_score: 50
                  gate_min_threshold: 40

  /grid/replication-metrics:
    get:
      tags:
        - Grid
      summary: Replication counters snapshot (PH-S690)
      operationId: getGridReplicationMetrics
      responses:
        '200':
          description: Replication metrics snapshot
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GridReplicationMetricsResponse'
              example:
                ok: true
                metrics:
                  strict_total: 0
                  enqueue_total: 0
                  executor_enqueue_total: 0
                  rate_limited_total: 0

  /grid/pricing-metrics:
    get:
      tags:
        - Grid
      summary: Pricing oracle counters snapshot (PH-S691)
      operationId: getGridPricingMetrics
      responses:
        '200':
          description: Pricing metrics snapshot
          content:
            application/json:
