    ProtocolMessage:
      type: object
      description: |
        Distributed RAID wire envelope (`src/raid/protocol.rs`).
        Request and response bodies use the same shape; responses set `type` to `{request_type}_response`.
      required:
        - type
        - id
        - timestamp
        - node_id
        - payload
      properties:
        type:
          type: string
          description: |
            Message kind, e.g. `put_artifact`, `get_artifact`, `delete_artifact`, `sync_artifacts`,
            `health_check`, `join_cluster`, `leave_cluster`, or `*_response` for replies.
        id:
          type: string
          format: uuid
        timestamp:
          type: string
          format: date-time
        node_id:
          type: string
          description: Originating node identifier
        payload:
          description: |
            Type-specific body. Request kinds map to `RaidDistributed*Payload` schemas;
            responses use matching `*ResponsePayload` inside `{type}_response` messages.
          oneOf:
            - $ref: '#/components/schemas/RaidDistributedPutArtifactPayload'
            - $ref: '#/components/schemas/RaidDistributedGetArtifactPayload'
            - $ref: '#/components/schemas/RaidDistributedDeleteArtifactPayload'
            - $ref: '#/components/schemas/RaidDistributedSyncArtifactsPayload'
            - $ref: '#/components/schemas/RaidDistributedHealthCheckPayload'
            - $ref: '#/components/schemas/RaidDistributedJoinClusterPayload'
            - $ref: '#/components/schemas/RaidDistributedLeaveClusterPayload'
            - $ref: '#/components/schemas/RaidDistributedPutArtifactResponsePayload'
            - $ref: '#/components/schemas/RaidDistributedGetArtifactResponsePayload'
            - $ref: '#/components/schemas/RaidDistributedDeleteArtifactResponsePayload'
            - $ref: '#/components/schemas/RaidDistributedSyncArtifactsResponsePayload'
            - $ref: '#/components/schemas/RaidDistributedHealthCheckResponsePayload'
            - $ref: '#/components/schemas/RaidDistributedJoinClusterResponsePayload'
            - $ref: '#/components/schemas/RaidDistributedLeaveClusterResponsePayload'
            - $ref: '#/components/schemas/RaidDistributedProtocolError'

    RaidDistributedSyncMode:
      type: string
      enum: [sync, async]

    RaidDistributedSyncDirection:
      type: string
      enum: [pull, push, bidirectional]

    RaidDistributedOperationStatus:
      type: string
      enum: [success, error]

    RaidDistributedArtifactStatus:
      type: string
      enum: [success, not_found, error]

    RaidDistributedHealthStatus:
      type: string
      enum: [healthy, degraded, unhealthy]

    RaidDistributedRaftRole:
      type: string
      enum: [leader, follower, candidate]

    RaidDistributedJoinStatus:
      type: string
      enum: [accepted, rejected]

    RaidDistributedLeaveReason:
      type: string
      enum: [shutdown, maintenance, error]

    RaidDistributedErrorCode:
      type: string
      enum:
        - ARTIFACT_NOT_FOUND
        - NODE_UNAVAILABLE
        - REPLICATION_FAILED
        - INSUFFICIENT_STORAGE
        - AUTHENTICATION_FAILED
        - AUTHORIZATION_FAILED
        - INVALID_REQUEST
        - CLUSTER_FULL
        - RAFT_ERROR

    RaidDistributedArtifactMetadata:
      type: object
      required: [name, version, size_bytes, checksum, created_at]
      properties:
