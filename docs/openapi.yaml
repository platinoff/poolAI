components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT token obtained from /login endpoint

  parameters:
    PeerId:
      name: peer_id
      in: path
      required: true
      schema:
        type: string
      description: Virtual node / worker peer identifier

  schemas:
    StatusResponse:
      type: object
      properties:
        status:
          type: string
          example: running
        version:
          type: string
          example: "0.1.0"
        uptime:
          type: integer
          format: int64
          example: 3600

    HealthResponse:
      type: object
      properties:
        status:
          type: string
          example: healthy
        timestamp:
          type: string
          format: date-time
        version:
          type: string
          example: "0.1.0"
        uptime:
          type: integer
          format: int64
          example: 3600
        checks:
          type: object
          properties:
            database:
              $ref: '#/components/schemas/HealthCheck'
            memory:
              $ref: '#/components/schemas/HealthCheck'
            workers:
              $ref: '#/components/schemas/HealthCheck'
            gpu:
              $ref: '#/components/schemas/HealthCheck'

    OpsPowerRequest:
      type: object
      required:
        - action
      properties:
        action:
          type: string
          enum: [shutdown, reboot]
          description: Power action for dev stand
          example: shutdown

    OpsPowerResponse:
      type: object
      properties:
        accepted:
          type: boolean
          example: true
        action:
          type: string
          example: shutdown
        dev_guard:
          type: boolean
          example: true
        note:
          type: string
          description: Dev-stand safety note (host reboot skipped)

    HealthCheck:
      type: object
      properties:
        status:
          type: string
          example: healthy
        message:
          type: string
          example: "Database connection OK"
        response_time_ms:
          type: integer
          example: 5

    AuthRequest:
      type: object
      required:
        - username
        - password
      properties:
        username:
          type: string
          example: admin
        password:
          type: string
          format: password
          example: password123

    AuthResponse:
      type: object
      properties:
        token:
          type: string
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        token_type:
          type: string
          example: Bearer
        expires_in:
          type: integer
          example: 3600
        role:
          type: string
          enum: [Admin, Operator, Viewer]
          example: Admin

    MetricsResponse:
      type: object
      properties:
        active_workers:
          type: integer
          example: 8
        total_requests:
          type: integer
          format: int64
          example: 12345
        avg_response_time:
          type: number
          format: float
          example: 12.5

    ModelInfo:
      type: object
      properties:
        name:
          type: string
          example: gpt-4
        status:
          type: string
          example: loaded
        memory_usage:
          type: integer
          format: int64
          example: 8192

    UserInfo:
      type: object
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
          example: admin
        role:
          type: string
          enum: [Admin, Operator, Viewer]
        active:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    UserCreateRequest:
      type: object
      required:
        - username
        - password
        - role
      properties:
        username:
          type: string
        password:
          type: string
          format: password
        role:
          type: string
          enum: [Admin, Operator, Viewer]

    UserUpdateRequest:
      type: object
      properties:
        username:
          type: string
        password:
          type: string
          format: password
        role:
          type: string
          enum: [Admin, Operator, Viewer]
        active:
          type: boolean

    CreateWorkerRequest:
      type: object
      required:
        - worker_id
      properties:
        worker_id:
          type: string
        max_concurrent_requests:
          type: integer
        request_timeout_ms:
          type: integer
          format: int64
        health_check_interval_ms:
          type: integer
          format: int64
        enable_caching:
          type: boolean
        cache_size:
          type: integer
        max_memory_mb:
          type: integer
        cpu_priority:
          type: integer
        gpu_device:
          type: integer
        auto_restart:
          type: boolean
        resource_monitoring:
          type: boolean

    CreateWorkerResponse:
      type: object
      properties:
        worker_id:
          type: string
        message:
          type: string

    DeleteWorkerResponse:
      type: object
      properties:
        worker_id:
          type: string
        message:
          type: string

    LibraryUploadRequest:
      type: object
      required:
        - name
        - version
        - data
      properties:
        name:
          type: string
        version:
          type: string
        data:
          type: string
          description: Base64-encoded library archive

    RaidStatusResponse:
      type: object
      properties:
        cluster_status:
          type: string
        node_count:
          type: integer
        artifact_count:
          type: integer
        storage:
          type: object
        mode:
          type: string
        replication_status:
          type: string
          nullable: true
        raft_status:
          type: object
          nullable: true
          properties:
            role:
              type: string
            term:
              type: integer
              format: int64
            leader_id:
              type: string
              nullable: true

    WorkerInfo:
      type: object
      properties:
        id:
          type: string
          example: worker-1
        status:
          type: string
          description: idle, busy, or error
          example: idle
        current_task:
          type: string
          nullable: true
          example: task-123
        is_healthy:
          type: boolean
          example: true
        total_requests_processed:
          type: integer
          format: int64
          example: 0
        queue_size:
          type: integer
          example: 0
        active_connections:
          type: integer
          example: 0
        average_response_time_ms:
          type: number
          format: double
          example: 0.0

    JobKind:
      type: string
      enum:
        - inference
        - training
        - fine_tune
        - indexing
        - embeddings
        - memory
        - system

    JobStoreBackend:
      type: string
      enum:
        - json
        - sqlite
        - raid
      description: |
        Coordinator job persistence mode (`src/job/store.rs`), resolved from env at first `JobStore::global()`:
        - **json** — default; atomic `jobs.json` under `POOLAI_JOB_DATA_DIR` (or in-memory when unset)
        - **sqlite** — `POOLAI_JOB_STORE=sqlite` and build feature `job-store-sqlite` → `jobs.db` (migrates legacy JSON on first open, FM-029)
        - **raid** — `POOLAI_JOB_STORE=raid`; full snapshot as RAID logical artifact (PH-S48); requires `POOLAI_RAID_BASE_PATH` before RAID manager / job store init

    JobStatus:
      type: string
      enum:
        - submitted
        - scheduled
        - leased
        - migrating
        - executing
        - verifying
        - rewarded
        - completed
        - failed

    JobSummary:
      type: object
      properties:
        id:
          type: string
        kind:
          $ref: '#/components/schemas/JobKind'
        status:
          $ref: '#/components/schemas/JobStatus'
        created_at:
          type: string
          format: date-time
        worker_id:
          type: string
          nullable: true
          description: Pool worker bound at schedule time (FM-034)
        vm_id:
          type: string
          nullable: true
          description: Running VM instance bound at schedule time (FM-034)
        lease_owner:
          type: string
          nullable: true
          description: Galaxy §4.3.1 lease holder (PH-S94)
        lease_epoch:
          type: integer
          format: int64
          minimum: 0
          nullable: true
          description: Monotonic lease generation (PH-S94)
        lease_expires_at:
          type: string
          format: date-time
          nullable: true
          description: Lease expiry instant (PH-S94)

    JobsListResponse:
      type: object
      required:
        - store_backend
        - jobs
      properties:
        store_backend:
          $ref: '#/components/schemas/JobStoreBackend'
        jobs:
          type: array
          items:
            $ref: '#/components/schemas/JobSummary'

    CreateJobRequest:
      type: object
      required:
        - kind
      properties:
        kind:
          $ref: '#/components/schemas/JobKind'
        priority:
          type: integer
          minimum: 0
          maximum: 255
          default: 0
        resources:
          $ref: '#/components/schemas/JobResources'
        input_artifact_ids:
          type: array
          items:
            type: string
        verification_policy:
          type: string
          nullable: true
        lease_owner:
          type: string
          nullable: true
          description: Galaxy §4.3.1 lease holder (srv/worker id); optional wire stub (PH-S94)
        lease_epoch:
          type: integer
          format: int64
          minimum: 0
          nullable: true
          description: Monotonic lease generation for CAS on job_id + lease_epoch (PH-S94)
        lease_expires_at:
          type: string
          format: date-time
          nullable: true
          description: Lease expiry; worker must renew before this instant (PH-S94)

    JobResources:
      type: object
      properties:
        cpu_threads:
          type: integer
          minimum: 1
          nullable: true
        gpu_memory_mb:
          type: integer
          format: int64
          minimum: 1
          nullable: true
        ram_mb:
          type: integer
          format: int64
          minimum: 1
          nullable: true
        disk_mb:
          type: integer
          format: int64
          minimum: 1
          nullable: true

    JobSpec:
      type: object
      required:
        - id
        - kind
      properties:
        id:
          type: string
        kind:
          $ref: '#/components/schemas/JobKind'
        resources:
          $ref: '#/components/schemas/JobResources'
        priority:
          type: integer
          minimum: 0
          maximum: 255
          default: 0
        max_duration_secs:
          type: integer
          format: int64
          nullable: true
        input_artifact_ids:
          type: array
          items:
            type: string
        verification_policy:
          type: string
          nullable: true
        deadline:
          type: string
          format: date-time
          nullable: true

    JobRecord:
      type: object
      required:
        - spec
        - status
        - created_at
      properties:
        spec:
          $ref: '#/components/schemas/JobSpec'
        status:
          $ref: '#/components/schemas/JobStatus'
        created_at:
          type: string
          format: date-time
        worker_id:
          type: string
          nullable: true
          description: Pool worker bound at schedule time (FM-034)
        vm_id:
          type: string
          nullable: true
          description: Running VM instance bound at schedule time (FM-034)
        lease_owner:
          type: string
          nullable: true
          description: Galaxy §4.3.1 lease holder (PH-S94)
        lease_epoch:
          type: integer
          format: int64
          minimum: 0
          nullable: true
          description: Monotonic lease generation (PH-S94)
        lease_expires_at:
          type: string
          format: date-time
          nullable: true
          description: Lease expiry instant (PH-S94)

    JobDetailResponse:
      type: object
      required:
        - job
      properties:
        job:
          $ref: '#/components/schemas/JobRecord'

    AcquireJobLeaseRequest:
      type: object
      description: Optional lease holder override (PH-S98); defaults to bound worker_id or vm_id.
      properties:
        lease_owner:
          type: string
          description: Galaxy §4.3.1 lease holder (srv/worker id)

    RenewJobLeaseRequest:
      type: object
      required:
        - lease_epoch
      properties:
        lease_epoch:
          type: integer
          format: int64
          minimum: 0
          description: Must match active lease epoch (PH-S99 heartbeat)

    PatchJobRequest:
      type: object
      required:
        - status
      properties:
        status:
          $ref: '#/components/schemas/JobStatus'
        lease_epoch:
          type: integer
          format: int64
          minimum: 0
          nullable: true
          description: Optional CAS guard — must match active lease_epoch when job has lease fields (PH-S95); omit for legacy PATCH

    ScheduleJobsResponse:
      type: object
      properties:
        scheduled:
          type: integer
          minimum: 0
          description: Count of jobs promoted from submitted to scheduled in this tick
        bound_workers:
          type: integer
          minimum: 0
          description: Count of jobs assigned a pool worker in this tick (FM-034)
        bound_vms:
          type: integer
          minimum: 0
          description: Count of jobs assigned a running VM instance in this tick (FM-034)
        expired:
          type: integer
          minimum: 0
          description: Count of submitted jobs past deadline marked failed (PH-S38)

    GridEnvelope:
      description: |
        Grid wire container v1 (`src/grid/envelope.rs`). Message body fields depend on `type`
        (serde externally tagged + flattened into the root object).
      oneOf:
        - allOf:
            - $ref: '#/components/schemas/GridEnvelopeHeader'
            - $ref: '#/components/schemas/GridJobBody'
        - allOf:
            - $ref: '#/components/schemas/GridEnvelopeHeader'
            - $ref: '#/components/schemas/GridResultBody'
        - allOf:
            - $ref: '#/components/schemas/GridEnvelopeHeader'
            - $ref: '#/components/schemas/GridMemoryShardBody'
        - allOf:
            - $ref: '#/components/schemas/GridEnvelopeHeader'
