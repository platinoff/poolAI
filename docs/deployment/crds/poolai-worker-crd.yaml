# PoolAI Worker Custom Resource Definition
# 
# This CRD defines the PoolAIWorker resource type for Kubernetes.
# Install with: kubectl apply -f poolai-worker-crd.yaml
#
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: poolaiworkers.poolai.io
  labels:
    app: poolai
    component: operator
spec:
  group: poolai.io
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required:
                - image
                - replicas
                - resources
              properties:
                image:
                  type: string
                  description: Container image for the worker
                  example: "poolai/worker:v1.0.0"
                replicas:
                  type: integer
                  minimum: 1
                  description: Number of worker replicas
                  example: 3
                resources:
                  type: object
                  required:
                    - cpu
                    - memory
                  properties:
                    cpu:
                      type: string
                      description: CPU request/limit (e.g., "100m", "1")
                      example: "500m"
                    memory:
                      type: string
                      description: Memory request/limit (e.g., "128Mi", "1Gi")
                      example: "512Mi"
                    gpu:
                      type: integer
                      minimum: 0
                      description: Number of GPUs (optional)
                      example: 1
                env:
                  type: object
                  additionalProperties:
                    type: string
                  description: Environment variables
            status:
              type: object
              properties:
                phase:
                  type: string
                  enum: [Pending, Running, Failed, Unknown]
                  description: Current phase of the worker
                ready:
                  type: boolean
                  description: Whether the worker is ready
                replicas:
                  type: integer
                  description: Current number of replicas
      subresources:
        status: {}
  scope: Namespaced
  names:
    plural: poolaiworkers
    singular: poolaiworker
    kind: PoolAIWorker
    shortNames:
      - paw
      - worker
