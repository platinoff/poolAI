# PoolAI VM Custom Resource Definition
# 
# This CRD defines the PoolAIVM resource type for Kubernetes.
# Install with: kubectl apply -f poolai-vm-crd.yaml
#
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: poolaivms.poolai.io
  labels:
    app: poolai
    component: operator
spec:
  group: poolai.io
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required:
                - image
                - resources
                - storage
              properties:
                image:
                  type: string
                  description: Container image for the VM
                  example: "poolai/vm:v1.0.0"
                resources:
                  type: object
                  required:
                    - cpu
                    - memory
                  properties:
                    cpu:
                      type: string
                      description: CPU request/limit (e.g., "500m", "1")
                      example: "1"
                    memory:
                      type: string
                      description: Memory request/limit (e.g., "512Mi", "2Gi")
                      example: "2Gi"
                    gpu:
                      type: integer
                      minimum: 0
                      description: Number of GPUs (optional)
                      example: 1
                storage:
                  type: object
                  required:
                    - size
                    - storage_class
                  properties:
                    size:
                      type: string
                      description: Storage size (e.g., "10Gi", "100Gi")
                      example: "20Gi"
                    storage_class:
                      type: string
                      description: Storage class name
                      example: "ssd"
                network:
                  type: object
                  properties:
                    ports:
                      type: array
                      items:
                        type: integer
                        minimum: 1
                        maximum: 65535
                      description: List of ports to expose
                      example: [8080, 9090]
                    service_type:
                      type: string
                      enum: [ClusterIP, NodePort, LoadBalancer]
                      default: ClusterIP
                      description: Kubernetes service type
            status:
              type: object
              properties:
                phase:
                  type: string
                  enum: [Pending, Running, Stopped, Failed, Unknown]
                  description: Current phase of the VM
                ready:
                  type: boolean
                  description: Whether the VM is ready
                endpoints:
                  type: array
                  items:
                    type: string
                  description: Service endpoints
      subresources:
        status: {}
  scope: Namespaced
  names:
    plural: poolaivms
    singular: poolaivm
    kind: PoolAIVM
    shortNames:
      - pav
      - vm
