{{- if .Values.apiServer.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "poolai.fullname" . }}-api-server
  labels:
    {{- include "poolai.labels" . | nindent 4 }}
    component: api-server
spec:
  type: {{ .Values.apiServer.service.type }}
  ports:
    - port: {{ .Values.apiServer.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "poolai.selectorLabels" . | nindent 4 }}
    component: api-server
{{- end }}
