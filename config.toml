[system]
name = "PoolAI"
version = "MVP_v1"
log_level = "info"
max_workers = 8
queue_size = 1000
metrics_interval = 5

[gpu]
enabled = true
memory_limit = 8192
temperature_limit = 85
power_limit = 200
gpu_count = 1

[pool]
max_workers = 8
queue_size = 1000
auto_scaling = true
scaling_threshold = 0.8
request_timeout = 30

[monitoring]
metrics_interval = 5
alert_threshold = 0.9
retention_days = 30
detailed_logging = true

[version]
app_version = "0.1.0"
build_time = "2023-10-27T10:00:00Z"

[health]
expected_workers = 8 