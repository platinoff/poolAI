# PH-S37: Regenerate Playwright visual snapshots on Linux (ubuntu-latest).
# Manual: Actions → "Update visual baselines (PH-S37)" → Run workflow.
# Default create_pr=true opens a PR with Linux PNGs (do not commit Windows snapshots).
name: Update visual baselines (PH-S37)

on:
  workflow_dispatch:
    inputs:
      create_pr:
        description: Open PR with refreshed Linux snapshots
        type: boolean
        default: true

env:
  CARGO_TERM_COLOR: always
  K8S_OPENAPI_ENABLED_VERSION: "1.28"
  POOLAI_HTTP_PORT: "8080"
  POOLAI_E2E_USER: admin
  POOLAI_E2E_PASSWORD: admin123
  CI: "true"

jobs:
  refresh-linux-snapshots:
    name: Refresh visual.spec.ts snapshots (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-visual-baselines-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-visual-baselines-

      - name: Install Playwright (e2e/)
        working-directory: e2e
        run: |
          npm install
          npx playwright install --with-deps chromium

      - name: Regenerate visual baselines
        run: bash bin/update-visual-baselines.sh

      - name: Upload snapshot artifacts
        uses: actions/upload-artifact@v4
        with:
          name: visual-spec-snapshots-linux
          path: e2e/tests/visual.spec.ts-snapshots/*.png
          if-no-files-found: error

      - name: Summary (manual download)
        if: ${{ inputs.create_pr == false }}
        run: |
          echo "Download artifact visual-spec-snapshots-linux → e2e/tests/visual.spec.ts-snapshots/"
          echo "Commit: test(e2e): refresh Linux visual baselines (PH-S37)"

  open-pr-with-snapshots:
    name: Open PR with Linux snapshots
    needs: refresh-linux-snapshots
    if: ${{ inputs.create_pr }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v4
        with:
          name: visual-spec-snapshots-linux
          path: artifact-snapshots

      - name: Copy snapshots into tree
        run: |
          cp -f artifact-snapshots/*.png e2e/tests/visual.spec.ts-snapshots/
          git add e2e/tests/visual.spec.ts-snapshots/*.png
          git diff --cached --stat

      - name: Create branch and PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if git diff --cached --quiet; then
            echo "No snapshot diff — baselines already match Linux render."
            exit 0
          fi
          BRANCH="ci/visual-baselines-ph-s37-$(date -u +%Y%m%d%H%M%S)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git commit -m "test(e2e): refresh Linux visual baselines (PH-S37)" \
            -m "Summary:" \
            -m "- Playwright visual.spec.ts snapshots from ubuntu-latest workflow" \
            -m "- Regenerate after UI drift (PH-S25…S34)"
          git push origin "$BRANCH"
          cat > /tmp/pr-body.md <<'EOF'
          ## Summary
          - Refreshes `e2e/tests/visual.spec.ts-snapshots/*.png` from **ubuntu-latest** (PH-S37 workflow).
          - Do not merge Windows-local snapshot updates.

          ## Test plan
          - [ ] CI Playwright admin job green on this PR
          - [ ] Visual diff review (masked charts/topology unchanged in intent)
          EOF
          gh pr create --title "test(e2e): Linux visual baselines (PH-S37)" \
            --body-file /tmp/pr-body.md \
            --base main --head "$BRANCH"
