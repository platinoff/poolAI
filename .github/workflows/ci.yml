name: CI

on:
  push:
    branches: [ main, stage3/* ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    name: Test Suite
    runs-on: ${{ matrix.os }}
    env:
      CARGO_BUILD_JOBS: "1"
      CARGO_INCREMENTAL: "0"
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        rust: [stable]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        timeout-minutes: 5
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      
      - name: Cache cargo registry
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-test-ph-s47f-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-test-ph-s47f-
            ${{ runner.os }}-cargo-
      
      - name: Normalize line endings
        run: |
          git config core.autocrlf false
          git config core.eol lf
          git add --renormalize .
      
      - name: Check code formatting
        run: cargo fmt --all -- --check
      
      - name: Lint with clippy (no features)
        run: cargo clippy --all-targets --no-default-features -- -D warnings
        continue-on-error: true
      
      - name: Build (no features) - Required
        run: cargo build --verbose --no-default-features --lib
      
      - name: Lint with clippy (with features)
        run: cargo clippy --all-targets --features jwt,https -- -D warnings
        continue-on-error: true
        env:
          K8S_OPENAPI_ENABLED_VERSION: "1.28"
      
      - name: Lint with clippy (cloud-sdk feature)
        run: cargo clippy --all-targets --features cloud,cloud-sdk -- -D warnings
        continue-on-error: true
        env:
          K8S_OPENAPI_ENABLED_VERSION: "1.28"
      
      - name: Build (with features)
        run: cargo build --verbose --features jwt,https
        continue-on-error: true
        env:
          K8S_OPENAPI_ENABLED_VERSION: "1.28"
      
      - name: Build (cloud-sdk feature)
        run: cargo build --verbose --features cloud,cloud-sdk
        continue-on-error: true
        env:
          K8S_OPENAPI_ENABLED_VERSION: "1.28"
      
      - name: Run tests (no features)
        run: cargo test --verbose --no-default-features
        continue-on-error: true
      
      - name: Run tests (default) - Required
        # FM-011 / PH-S47: same as `cargo test-ci` (.cargo/config.toml); --verbose must be before `--`
        run: cargo test -j 1 --verbose --lib --tests --features ml,enterprise,cloud,test-utils,job-store-sqlite,prometheus -- --test-threads=1
        env:
          K8S_OPENAPI_ENABLED_VERSION: "1.28"
          CARGO_BUILD_JOBS: "1"
      
      - name: Run tests (cloud-sdk feature)
        run: cargo test --verbose --features cloud,cloud-sdk
        continue-on-error: true
        env:
          K8S_OPENAPI_ENABLED_VERSION: "1.28"
      
      - name: Security audit
        uses: rustsec/audit-check@v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

  check:
    name: Check (no features)
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        timeout-minutes: 5
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      
      - name: Check compilation (without optional deps)
        run: cargo check --no-default-features --lib

  ui-changes:
    name: Detect UI / pa11y / E2E changes
    runs-on: ubuntu-latest
    outputs:
      ui: ${{ steps.filter.outputs.ui }}
      e2e: ${{ steps.filter.outputs.e2e }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        timeout-minutes: 5

      - name: Paths filter
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            ui:
              - 'src/ui/**'
              - 'bin/pa11y-ci.sh'
              - '.github/workflows/a11y.yml'
              - '.github/workflows/ci.yml'
              - 'tests/pa11y_ci_script.rs'
            e2e:
              - 'e2e/**'
              - 'bin/e2e-playwright.sh'
              - 'bin/update-visual-baselines.sh'
              - '.github/workflows/e2e.yml'
              - '.github/workflows/update-visual-baselines.yml'
              - 'src/ui/**'
              - '.github/workflows/ci.yml'

  pa11y-wcag22:
    name: Pa11y WCAG 2.2
    needs: ui-changes
    if: needs.ui-changes.outputs.ui == 'true'
    uses: ./.github/workflows/a11y.yml
    secrets: inherit

  playwright-admin:
    name: Playwright admin E2E
    needs: ui-changes
    if: needs.ui-changes.outputs.ui == 'true' || needs.ui-changes.outputs.e2e == 'true'
    uses: ./.github/workflows/e2e.yml
    secrets: inherit

  openapi-gap-audit:
    name: OpenAPI gap audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        timeout-minutes: 5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-openapi-gap-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-openapi-gap-

      - name: Axum routes vs docs/openapi.yaml
        run: cargo run --bin poolai-openapi-gap-audit

  rust-ratio-audit:
    name: Rust LOC ratio hold gate (PH-S165)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        timeout-minutes: 5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-rust-ratio-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-rust-ratio-

      - name: Product code Rust share (hold band advisory)
        run: >
          cargo run --bin poolai-loc-audit --
          --warn-below 0.93
          --target 0.95
          --stretch 0.96
          --min-ratio 0.95
          --advisory

  pa11y-contract:
    name: Pa11y script contract
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        timeout-minutes: 5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-pa11y-contract-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-pa11y-contract-

      - name: Verify pa11y-ci.sh contract
        run: cargo test --test pa11y_ci_script
        env:
          K8S_OPENAPI_ENABLED_VERSION: "1.28"

  check-features:
    name: Check Features
    runs-on: ubuntu-latest
    strategy:
      matrix:
        features:
          - jwt
          - https
          - jwt,https
          - raft
          - cloud,cloud-sdk
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        timeout-minutes: 5
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      
      - name: Check with features
        run: cargo check --features ${{ matrix.features }}
        continue-on-error: true
        env:
          K8S_OPENAPI_ENABLED_VERSION: "1.28"

