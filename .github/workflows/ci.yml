name: CI

on:
  push:
    branches: [ main, stage3/* ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    name: Test Suite
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        rust: [stable]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        timeout-minutes: 5
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      
      - name: Cache cargo registry
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
      
      - name: Normalize line endings
        run: |
          git config core.autocrlf false
          git config core.eol lf
          git add --renormalize .
      
      - name: Check code formatting
        run: cargo fmt --all -- --check
      
      - name: Lint with clippy (no features)
        run: cargo clippy --all-targets --no-default-features -- -D warnings
        continue-on-error: true
      
      - name: Build (no features) - Required
        run: cargo build --verbose --no-default-features --lib
      
      - name: Lint with clippy (with features)
        run: cargo clippy --all-targets --features jwt,https -- -D warnings
        continue-on-error: true
        env:
          K8S_OPENAPI_ENABLED_VERSION: "1.28"
      
      - name: Lint with clippy (cloud-sdk feature)
        run: cargo clippy --all-targets --features cloud,cloud-sdk -- -D warnings
        continue-on-error: true
        env:
          K8S_OPENAPI_ENABLED_VERSION: "1.28"
      
      - name: Build (with features)
        run: cargo build --verbose --features jwt,https
        continue-on-error: true
        env:
          K8S_OPENAPI_ENABLED_VERSION: "1.28"
      
      - name: Build (cloud-sdk feature)
        run: cargo build --verbose --features cloud,cloud-sdk
        continue-on-error: true
        env:
          K8S_OPENAPI_ENABLED_VERSION: "1.28"
      
      - name: Run tests (no features)
        run: cargo test --verbose --no-default-features
        continue-on-error: true
      
      - name: Run tests (default) - Required
        run: cargo test --verbose --lib --tests
        env:
          K8S_OPENAPI_ENABLED_VERSION: "1.28"
      
      - name: Run tests (cloud-sdk feature)
        run: cargo test --verbose --features cloud,cloud-sdk
        continue-on-error: true
        env:
          K8S_OPENAPI_ENABLED_VERSION: "1.28"
      
      - name: Security audit
        uses: rustsec/audit-check@v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

  check:
    name: Check (no features)
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        timeout-minutes: 5
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      
      - name: Check compilation (without optional deps)
        run: cargo check --no-default-features --lib

  check-features:
    name: Check Features
    runs-on: ubuntu-latest
    strategy:
      matrix:
        features:
          - jwt
          - https
          - jwt,https
          - raft
          - cloud,cloud-sdk
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        timeout-minutes: 5
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      
      - name: Check with features
        run: cargo check --features ${{ matrix.features }}
        continue-on-error: true
        env:
          K8S_OPENAPI_ENABLED_VERSION: "1.28"

