# FM-039: Playwright admin suite (smoke + admin + axe). See docs/development/E2E_PLAYWRIGHT.md
# Invoked from ci.yml when UI/e2e paths change; manual: workflow_dispatch.
name: E2E (Playwright)

on:
  workflow_call:
  workflow_dispatch: {}

env:
  CARGO_TERM_COLOR: always
  K8S_OPENAPI_ENABLED_VERSION: "1.28"
  POOLAI_HTTP_PORT: "8080"
  POOLAI_E2E_USER: admin
  POOLAI_E2E_PASSWORD: admin123
  CI: "true"
  # PH-S44: full suite (smoke+admin+a11y+visual); ml skipped via POOLAI_FEATURES
  CARGO_BUILD_JOBS: "1"
  CARGO_INCREMENTAL: "0"
  POOLAI_FEATURES: enterprise,cloud,test-utils

jobs:
  playwright-admin:
    name: Playwright admin suite
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-e2e-ph-s47c-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-e2e-ph-s47c-
            ${{ runner.os }}-e2e-

      - name: Install Playwright (e2e/)
        working-directory: e2e
        run: |
          npm install
          npx playwright install --with-deps chromium

      - name: Build poolai and run smoke tests
        run: bash bin/e2e-playwright.sh --start
